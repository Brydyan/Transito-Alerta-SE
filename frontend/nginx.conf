user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 20M;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: cualquier ruta que no sea un archivo static,
    # devuelve index.html (Angular router maneja la navegación)
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Assets (js, css, images) con cache agresivo
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Socket.IO WebSocket proxy — sin este bloque nginx no pasa el header
    # Upgrade y el cliente cae a long-polling, lo que hace fallar wss://.
    location /socket.io/ {
      proxy_pass http://backend:3001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API proxy al backend (opcional, si el frontend hace requests a /api/*)
    location /api/ {
      proxy_pass http://backend:3001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO reverse proxy (infra/2026-10-07-minio-object-storage, design D4).
    # Sirve las imágenes de MinIO por el mismo host/puerto del frontend, así
    # no hay CORS ni puertos extra en el firewall.
    #
    # 2026-10-21 — `proxy_pass $minio_upstream/uploads/` NO hacía lo que el
    # comentario de abajo afirmaba. Cuando `proxy_pass` contiene variables,
    # nginx usa el URI de la directiva TAL CUAL y no le anexa el request
    # URI: el prefijo `/storage/` se reemplazaba pero todo lo que venía
    # detrás se perdía. MinIO recibía `/uploads/` — la raíz del bucket — y
    # contestaba un `ListBucketResult`: HTTP 200, `application/xml`, 1039
    # bytes. El navegador se tragaba ese XML como si fuera la imagen, el
    # `<img>` no podía decodificarlo y pintaba su `alt`, que es donde
    # apareció el texto "Imagen del incidente" en vez de la foto.
    #
    # El `rewrite ... break` construye la URI correcta, y `proxy_pass` sin
    # path la envía tal cual. Se conserva la variable — sin ella nginx
    # resolvería `minio` una sola vez al arrancar y apuntaría a una IP
    # vieja cuando MinIO se recrea en cada deploy.
    location /storage/ {
      resolver 127.0.0.11 valid=30s;
      set $minio_upstream http://minio:9000;
      rewrite ^/storage/(.*)$ /uploads/$1 break;
      proxy_pass $minio_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Cache de imágenes en cliente (las claves son UUID.webp — efectivamente
      # inmutables, podemos cachear agresivamente).
      expires 30d;
      add_header Cache-Control "public, no-transform";
    }
  }
}
