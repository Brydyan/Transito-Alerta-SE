user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 20M;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: cualquier ruta que no sea un archivo static,
    # devuelve index.html (Angular router maneja la navegación)
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Assets (js, css, images) con cache agresivo
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # API proxy al backend (opcional, si el frontend hace requests a /api/*)
    location /api/ {
      proxy_pass http://backend:3001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO reverse proxy (infra/2026-10-07-minio-object-storage, design D4).
    # Sirve las imágenes de MinIO por el mismo host/puerto del frontend, así
    # no hay CORS ni puertos extra en el firewall. El `trailing slash` en
    # `proxy_pass http://minio:9000/uploads/` reemplaza el prefijo `/storage/`
    # por `/uploads/`, que es donde MinIO expone los objetos del bucket.
    location /storage/ {
      resolver 127.0.0.11 valid=30s;
      set $minio_upstream http://minio:9000;
      proxy_pass $minio_upstream/uploads/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Cache de imágenes en cliente (las claves son UUID.webp — efectivamente
      # inmutables, podemos cachear agresivamente).
      expires 30d;
      add_header Cache-Control "public, no-transform";
    }
  }
}
