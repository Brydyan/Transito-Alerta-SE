<header
  class="flex items-center justify-between border-b border-border-subtle px-8 bg-bg-secondary h-16"
>
  <div class="flex items-center w-full">
    <!-- Hamburger Menu toggle (for sidebar) -->
    <button
      class="flex items-center text-slate-800 p-0 border-none bg-transparent hover:text-brand-navy transition-colors"
      (click)="toggleSidebar()"
    >
      <i class="bi bi-list text-2xl"></i>
    </button>

    <!-- Right Side Icons -->
    <div class="flex items-center ml-auto gap-4">
      <button class="btn-icon p-1 text-slate-500 bg-transparent border-none">
        <i class="bi bi-search text-xl"></i>
      </button>
      <button class="btn-icon p-1 text-slate-500 bg-transparent border-none relative">
        <i class="bi bi-bell text-xl"></i>
        <!-- Optional notification dot -->
        <span
          class="absolute top-1 right-1 w-2.5 h-2.5 bg-status-critical border-2 border-white rounded-full"
        >
          <span class="sr-only">New alerts</span>
        </span>
      </button>
      <button class="btn-icon p-1 text-slate-500 bg-transparent border-none">
        <i class="bi bi-moon text-xl"></i>
      </button>

      <!-- User Profile Dropdown -->
      @if (authService.currentUser(); as user) {
        <div class="relative">
          <button
            class="flex items-center gap-2 p-0 bg-transparent border-none cursor-pointer"
            type="button"
            (click)="toggleUserDropdown()"
          >
            <div class="flex items-center gap-2">
              <div
                class="avatar bg-brand-navy text-white rounded-full flex items-center justify-center overflow-hidden w-9 h-9"
              >
                @if (user.avatar?.url) {
                  <img
                    [src]="user.avatar!.url"
                    [alt]="user.name"
                    class="w-full h-full object-cover"
                  />
                } @else {
                  {{ user.name?.charAt(0)?.toUpperCase() }}
                }
              </div>
              <div class="hidden md:block text-left">
                <div class="font-semibold text-slate-800 text-sm">{{ user.name }}</div>
                <div class="text-slate-500 text-xs">
                  {{ user.roleName || 'Usuario' }}
                </div>
              </div>
              <i
                class="bi bi-chevron-down text-slate-500 text-xs transition-transform duration-200"
                [class.rotate-180]="userDropdownOpen()"
              ></i>
            </div>
          </button>
          <ul
            class="absolute right-0 mt-2 w-48 bg-white border border-border-subtle rounded-lg shadow-lg py-1 z-[1000]"
            [class.hidden]="!userDropdownOpen()"
            [class.block]="userDropdownOpen()"
          >
            <li>
              <a class="block px-4 py-2 text-sm text-slate-800 hover:bg-slate-100 hover:text-brand-navy transition-colors" routerLink="/app/profile" (click)="closeUserDropdown()">
                <i class="bi bi-person mr-2"></i> Mi Perfil
              </a>
            </li>
            <li>
              <a class="block px-4 py-2 text-sm text-slate-800 hover:bg-slate-100 hover:text-brand-navy transition-colors" routerLink="/app/admin/config" (click)="closeUserDropdown()">
                <i class="bi bi-gear mr-2"></i> Configuración
              </a>
            </li>
            <li>
              <hr class="my-1 border-t border-border-subtle" />
            </li>
            <li>
              <button class="block w-full text-left px-4 py-2 text-sm text-status-critical hover:bg-red-50 transition-colors border-none bg-transparent cursor-pointer" (click)="logout()">
                <i class="bi bi-box-arrow-right mr-2"></i> Cerrar Sesión
              </button>
            </li>
          </ul>
        </div>
      }
    </div>
  </div>
</header>
