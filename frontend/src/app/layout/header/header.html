<header
  class="flex items-center justify-between border-b border-border-subtle px-8 bg-bg-secondary h-16"
>
  <div class="flex items-center w-full">
    <!-- Hamburger Menu toggle (for sidebar) -->
    <button
      class="flex items-center text-slate-800 p-0 border-none bg-transparent hover:text-brand-primary transition-colors"
      (click)="toggleSidebar()"
      aria-label="Alternar barra lateral"
    >
      <ui-icon name="menu" [size]="24" />
    </button>

    <!-- Right Side Icons -->
    <div class="flex items-center ml-auto gap-4">
      <button class="btn-icon p-1 text-slate-500 bg-transparent border-none" aria-label="Buscar">
        <ui-icon name="search" [size]="20" />
      </button>
      <button
        class="btn-icon p-1 text-slate-500 bg-transparent border-none relative"
        aria-label="Notificaciones"
      >
        <ui-icon name="bell" [size]="20" />
        <!-- Optional notification dot -->
        <span
          class="absolute top-1 right-1 w-2.5 h-2.5 bg-prio-high border-2 border-white rounded-full"
        >
          <span class="sr-only">New alerts</span>
        </span>
      </button>
      <button class="btn-icon p-1 text-slate-500 bg-transparent border-none" aria-label="Modo oscuro">
        <ui-icon name="moon" [size]="20" />
      </button>

      <!-- User Profile Dropdown -->
      @if (authService.currentUser(); as user) {
        <div class="relative">
          <button
            class="flex items-center gap-2 p-0 bg-transparent border-none cursor-pointer"
            type="button"
            (click)="toggleUserDropdown()"
            [attr.aria-expanded]="userDropdownOpen()"
          >
            <div class="flex items-center gap-2">
              <div
                class="avatar bg-brand-primary text-white rounded-full flex items-center justify-center overflow-hidden w-9 h-9"
              >
                @if (user.avatar?.url) {
                  <img
                    [src]="user.avatar!.url"
                    [alt]="user.name"
                    class="w-full h-full object-cover"
                  />
                } @else {
                  {{ user.name?.charAt(0)?.toUpperCase() }}
                }
              </div>
              <div class="hidden md:block text-left">
                <div class="font-semibold text-slate-800 text-sm">{{ user.name }}</div>
                <div class="text-slate-500 text-xs">
                  {{ user.roleName || 'Usuario' }}
                </div>
              </div>
              <ui-icon
                name="chevron-down"
                [size]="14"
                extraClass="text-slate-500 transition-transform duration-200"
                [class.rotate-180]="userDropdownOpen()"
              />
            </div>
          </button>
          <ul
            class="absolute right-0 mt-2 w-48 bg-white border border-border-subtle rounded-lg shadow-lg py-1 z-[1000]"
            [class.hidden]="!userDropdownOpen()"
            [class.block]="userDropdownOpen()"
          >
            <li>
              <a
                class="block px-4 py-2 text-sm text-slate-800 hover:bg-slate-50 hover:text-brand-primary transition-colors"
                routerLink="/app/profile"
                (click)="closeUserDropdown()"
              >
                <ui-icon name="user" [size]="16" extraClass="mr-2" /> Mi Perfil
              </a>
            </li>
            <li>
              <a
                class="block px-4 py-2 text-sm text-slate-800 hover:bg-slate-50 hover:text-brand-primary transition-colors"
                routerLink="/app/admin/config"
                (click)="closeUserDropdown()"
              >
                <ui-icon name="settings" [size]="16" extraClass="mr-2" /> Configuración
              </a>
            </li>
            <li>
              <hr class="my-1 border-t border-border-subtle" />
            </li>
            <li>
              <button
                class="block w-full text-left px-4 py-2 text-sm text-prio-high hover:bg-red-50 transition-colors border-none bg-transparent cursor-pointer"
                (click)="logout()"
              >
                <ui-icon name="log-out" [size]="16" extraClass="mr-2" /> Cerrar Sesión
              </button>
            </li>
          </ul>
        </div>
      }
    </div>
  </div>
</header>
