<!-- Card grid — visible on mobile/tablet only -->
<div
  data-card-grid
  [class]="(isSmallViewport$ | async) ? 'grid grid-cols-1 md:grid-cols-2 gap-4' : 'hidden'"
>
  @for (item of items(); track item[trackKey()]) {
    <app-data-card
      [data]="item"
      [fields]="cardFields()"
      [actions]="cardActions()"
      (detailClicked)="detailClicked.emit($event)"
      (actionClicked)="actionClicked.emit($event)"
    ></app-data-card>
  }
</div>

<!-- "Ver más datos" button — mobile only, below card grid (D5, S3.2–S3.5) -->
@if ((isSmallViewport$ | async) && hasMore()) {
  <div class="mt-4 text-center">
    <button
      data-load-more
      [disabled]="isLoadingMore()"
      (click)="loadMore.emit()"
      class="inline-flex items-center gap-2 px-6 py-3 text-sm font-medium rounded-lg border transition-all duration-200 bg-brand-primary border-brand-primary text-white hover:bg-brand-primary-hover hover:border-brand-primary-hover focus:ring-2 focus:ring-brand-primary/40 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      @if (isLoadingMore()) {
        <span class="animate-spin inline-block w-4 h-4 border-2 border-current border-t-transparent rounded-full" aria-hidden="true"></span>
        Cargando...
      } @else {
        Ver más datos
      }
    </button>
  </div>
}

<!-- Table — visible on desktop only -->
<div data-table-wrapper [class]="(isSmallViewport$ | async) ? 'hidden' : ''">
  <ng-content />
</div>
