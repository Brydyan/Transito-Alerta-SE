<!-- Card grid — visible on mobile/tablet only -->
<div
  data-card-grid
  [class]="(isSmallViewport$ | async) ? 'grid grid-cols-1 md:grid-cols-2 gap-4' : 'hidden'"
>
  @for (item of items(); track item['id']) {
    <app-data-card
      [data]="item"
      [fields]="cardFields()"
      [actions]="cardActions()"
      (detailClicked)="detailClicked.emit($event)"
      (actionClicked)="actionClicked.emit($event)"
    ></app-data-card>
  }
</div>

<!-- Table — visible on desktop only -->
<div data-table-wrapper [class]="(isSmallViewport$ | async) ? 'hidden' : ''">
  <ng-content />
</div>
