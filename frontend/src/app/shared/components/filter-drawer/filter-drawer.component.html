<!--
  FilterDrawer presentation (S4.x) — anchored panel below button (Batch 5 polish).

  A SINGLE projected slot (`ng-content`) that is ALWAYS rendered, with its
  role switched purely by CSS classes. This preserves Angular 21 projection
  (content projects into LAST ng-content of mutually-exclusive branches) — the
  old two-slot layout left desktop empty (S4.1 regression). One always-rendered
  slot avoids that entirely.

  Roles by state:
  - Desktop (>= 1024px): wrapper is plain block; panel container is inline
    and always visible (S4.1).
  - Mobile (< 1024px), closed: wrapper is `relative inline-flex`; "Filtros"
    toggle visible (S4.2); panel container `hidden`.
  - Mobile, open: same wrapper `relative`; panel container becomes anchored
    dropdown `absolute left-0 top-full mt-2 w-72 rounded-lg border shadow-lg
    z-50 max-h-[80vh] overflow-y-auto p-4` with header + close (S4.3, S4.5).
    NO dark overlay (`bg-black/30 fixed inset-0` removed); outside tap handled
    via ClickOutsideDirective so grid remains visible. Filter changes apply
    immediately (S4.4). Absolute positioning avoids layout shift.
-->

<div
  data-filter-wrapper
  [class.relative]="(isSmallViewport$ | async) === true"
  [class.flex]="(isSmallViewport$ | async) === true"
  [class.w-full]="(isSmallViewport$ | async) === true"
  [class.justify-end]="(isSmallViewport$ | async) === true"
  appClickOutside
  (appClickOutside)="onClickOutside()"
>
  @if ((isSmallViewport$ | async) === true) {
    <!-- Mobile "Filtros" toggle — always visible on mobile, aria-expanded reflects panel state -->
    <button
      data-filters-toggle
      type="button"
      [attr.aria-expanded]="isOpen()"
      aria-haspopup="true"
      aria-label="Filtros"
      (click)="toggleDrawer()"
      class="inline-flex items-center gap-2 px-4 py-2 min-h-[44px] min-w-[44px] h-11 text-sm font-medium rounded-lg border transition-all duration-200 bg-bg-secondary border-border-subtle text-text-primary hover:bg-bg-tertiary focus-visible:ring-2 focus-visible:ring-brand-primary/40 focus-visible:outline-none focus:ring-2 focus:ring-brand-primary/40"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
      </svg>
      <!-- Solo se muestra el icono para adecuar a la interfaz móvil -->
    </button>
  }

  <!--
    Content container — ALWAYS rendered (single ng-content).
    Desktop: inline visible. Mobile closed: hidden. Mobile open: anchored panel.
  -->
  <div
    data-filter-panel
    [attr.data-filter-drawer]="(isSmallViewport$ | async) === true && isOpen() ? '' : null"
    [class.hidden]="(isSmallViewport$ | async) === true && !isOpen()"
    [class.absolute]="(isSmallViewport$ | async) === true && isOpen()"
    [class.right-0]="(isSmallViewport$ | async) === true && isOpen()"
    [class.top-full]="(isSmallViewport$ | async) === true && isOpen()"
    [class.mt-2]="(isSmallViewport$ | async) === true && isOpen()"
    [class.w-72]="(isSmallViewport$ | async) === true && isOpen()"
    [class.rounded-lg]="(isSmallViewport$ | async) === true && isOpen()"
    [class.border]="(isSmallViewport$ | async) === true && isOpen()"
    [class.border-border-subtle]="(isSmallViewport$ | async) === true && isOpen()"
    [class.bg-bg-secondary]="(isSmallViewport$ | async) === true && isOpen()"
    [class.shadow-lg]="(isSmallViewport$ | async) === true && isOpen()"
    [class.z-50]="(isSmallViewport$ | async) === true && isOpen()"
    [class.p-4]="(isSmallViewport$ | async) === true && isOpen()"
    [class.overflow-y-auto]="(isSmallViewport$ | async) === true && isOpen()"
    [ngClass]="(isSmallViewport$ | async) === true && isOpen() ? 'max-h-[80vh]' : ''"
  >
    @if ((isSmallViewport$ | async) === true && isOpen()) {
      <!-- Panel header (S4.5) -->
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-text-primary">Filtros</h2>
        <button
          data-filter-close
          type="button"
          (click)="closeDrawer()"
          class="p-2 min-h-[44px] min-w-[44px] h-11 w-11 inline-flex items-center justify-center rounded-lg hover:bg-bg-tertiary transition-colors focus-visible:ring-2 focus-visible:ring-brand-primary/40 focus-visible:outline-none focus:ring-2 focus:ring-brand-primary/40"
          aria-label="Cerrar filtros"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
    }

    <!-- Filter content projected from parent (S4.4: changes apply immediately) -->
    <ng-content />
  </div>
</div>
