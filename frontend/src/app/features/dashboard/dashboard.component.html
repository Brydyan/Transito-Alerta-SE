<ui-page-header
  kicker="Inicio"
  title="Dashboard"
  subtitle="Resumen de actividad e incidencias"
/>

@if (error()) {
  <div class="error-banner" role="alert">
    <strong>Algunos datos no se cargaron.</strong>
    {{ error() }}
  </div>
}

<section class="kpi-grid" aria-label="Tarjetas de indicadores">
  @for (kpi of kpis(); track kpi.key) {
    <ui-kpi-card
      [label]="kpi.label"
      [value]="kpi.value"
      [iconName]="kpi.icon"
      [tone]="kpi.tone"
      [trend]="kpi.trend"
    />
  }
</section>

<section class="grid-2" aria-label="Gráficos principales">
  <app-top-categories-chart [data]="topCategories()" />
  <app-recent-activity [rows]="activity()" />
</section>

<section class="grid-1" aria-label="Gráfico semanal">
  <app-weekly-performance-chart [data]="weeklyDays()" />
</section>
