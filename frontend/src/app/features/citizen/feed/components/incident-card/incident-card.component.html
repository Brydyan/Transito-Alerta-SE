<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
  <!--Header: Author & Time -->
  <div class="flex items-center justify-between p-4 border-b border-gray-50">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center">
        <!-- Placeholder for user avatar -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
        </svg>
      </div>
      <div>
        <div class="font-medium text-gray-900">Usuario</div>
        <div class="text-xs text-gray-500 flex gap-2">
          <span>{{ relativeAge }}</span>
          <!-- <span>&bull;</span> -->
          <!-- <span class="truncate max-w-[150px]">{{ incident.zone_id ? 'Zona ' + incident.zone_id : 'Ubicación General' }}</span> -->
        </div>
      </div>
    </div>
    <div class="text-right">
      <!-- <div class="text-xs font-mono text-gray-400">#{{ shortId }}</div> -->
    </div>
  </div>

  <!-- Body -->
  <div class="p-4 space-y-3">
    <!-- Badges -->
    <div class="flex gap-2">
      <span class="px-2.5 py-1 text-xs font-medium rounded-full bg-blue-100 text-blue-800">
        {{ statusLabel }}
      </span>
      <span class="px-2.5 py-1 text-xs font-medium rounded-full"
            [ngClass]="{
              'bg-gray-100 text-gray-800': incident.priority === 'low',
              'bg-yellow-100 text-yellow-800': incident.priority === 'medium',
              'bg-orange-100 text-orange-800': incident.priority === 'high',
              'bg-red-100 text-red-800': incident.priority === 'critical'
            }">
        Prioridad {{ priorityLabel }}
      </span>
    </div>

    <h4 class="font-bold text-lg text-gray-900">{{ incident.title }}</h4>
    <p *ngIf="incident.description" class="text-gray-600 text-sm line-clamp-2">
      {{ incident.description }}
    </p>

    <!-- Location: string location expected only (NO COORDINATES) -->
    <div class="flex items-center justify-between mt-3 text-sm">
      <div class="flex items-center gap-1.5 text-gray-500 font-mono text-xs">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span *ngIf="locationName">{{ locationName }}</span>
        <span *ngIf="!locationName">{{ incident.lat | number:'1.4-4' }}, {{ incident.lng | number:'1.4-4' }}</span>
      </div>
      <button class="text-blue-600 hover:text-blue-700 font-medium text-sm flex items-center gap-1">
        Ver descripción
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Actions -->
  <div class="flex border-t border-gray-50 bg-gray-50/50">
    <button class="flex-1 py-3 flex items-center justify-center gap-2 text-sm font-medium transition-colors"
            [ngClass]="incident.is_followed_by_me ? 'text-blue-600 hover:text-blue-700' : 'text-gray-500 hover:text-gray-700 hover:bg-gray-100'"
            (click)="toggleFollow()">
      <svg *ngIf="!incident.is_followed_by_me" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
      </svg>
      <svg *ngIf="incident.is_followed_by_me" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
        <path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z" />
      </svg>
      Seguir <span *ngIf="incident.follower_count > 0" class="text-xs bg-gray-200 text-gray-700 px-1.5 py-0.5 rounded-full ml-1">{{ incident.follower_count }}</span>
    </button>
    <div class="w-px bg-gray-200"></div>
    <button class="flex-1 py-3 flex items-center justify-center gap-2 text-sm font-medium transition-colors"
            [disabled]="isCorroborateDisabled"
            [ngClass]="isCorroborateDisabled ? 'text-green-600 cursor-not-allowed opacity-80' : 'text-gray-500 hover:text-gray-700 hover:bg-gray-100'"
            (click)="corroborate()">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" [ngClass]="incident.is_corroborated_by_me ? 'fill-current' : 'fill-none stroke-current'" viewBox="0 0 24 24" stroke-width="2">
        <path *ngIf="!incident.is_corroborated_by_me" stroke-linecap="round" stroke-linejoin="round" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        <path *ngIf="incident.is_corroborated_by_me" stroke-linecap="round" stroke-linejoin="round" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      Yo también reporto <span *ngIf="incident.corroboration_count > 0" class="text-xs bg-gray-200 text-gray-700 px-1.5 py-0.5 rounded-full ml-1">{{ incident.corroboration_count }}</span>
    </button>
  </div>
</div>
