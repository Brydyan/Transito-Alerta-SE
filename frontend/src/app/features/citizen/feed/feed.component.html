<div class="flex flex-col md:flex-row gap-6 p-4 max-w-7xl mx-auto">
  <!-- Left column: Main Feed -->
  <div class="flex-1 space-y-6">

    <!-- Composer (B.3.1) -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4 cursor-pointer hover:bg-gray-50 transition-colors" (click)="goToReport()">
      <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold">
        <!-- Placeholder user avatar -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
        </svg>
      </div>
      <div class="flex-1 text-gray-500 font-medium">
        ¿Qué incidencia deseas reportar hoy?
      </div>
    </div>

    <!-- Feed list -->
    <div class="space-y-7">
      <app-incident-card
        *ngFor="let incident of incidents"
        [incident]="incident">
      </app-incident-card>

      <!-- Empty State -->
      <div *ngIf="incidents.length === 0 && !isLoading" class="text-center py-10 text-gray-500 bg-white rounded-xl border border-gray-100">
        No hay incidencias que coincidan con los filtros.
      </div>

      <!-- Loading -->
      <div *ngIf="isLoading" class="text-center py-4 text-blue-600 font-medium">
        Cargando incidencias...
      </div>

      <!-- End of Feed (B.3.6) -->
      <div *ngIf="!hasMore && incidents.length > 0" class="text-center py-6 text-gray-400 text-sm font-medium">
        Has visto todas las incidencias recientes
      </div>
    </div>
  </div>

  <!-- Right column: Sidebar (Filters & Stats) -->
  <div class="w-full md:w-80 space-y-6">
    <app-feed-filters (filtersChanged)="onFilterChange($event)"></app-feed-filters>

    <!-- Stats & Rankings (B.3.8) -->
    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
      <h3 class="font-bold text-gray-800 mb-4 text-lg">Estadísticas de hoy</h3>
      <div class="space-y-3 text-sm">
        <div class="flex justify-between items-center">
          <span class="text-gray-600">Nuevas:</span>
          <span class="font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded-md">{{ getDailyStats().newCount }}</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-gray-600">Resueltas:</span>
          <span class="font-bold text-green-600 bg-green-50 px-2 py-1 rounded-md">{{ getDailyStats().resolvedCount }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
