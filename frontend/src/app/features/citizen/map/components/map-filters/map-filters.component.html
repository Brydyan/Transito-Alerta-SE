<div class="relative">
  <!-- Trigger button -->
  <button type="button" (click)="togglePanel()" class="bg-white rounded-full p-3 shadow-md border border-gray-200 hover:bg-gray-50 flex items-center justify-center transition-colors">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
    </svg>
  </button>

  <!-- Panel -->
  @if (isOpen()) {
    <div class="absolute top-14 right-0 w-72 bg-white rounded-xl shadow-xl border border-gray-100 p-4">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-gray-800">Filtros del Mapa</h3>
        <button (click)="togglePanel()" class="text-gray-400 hover:text-gray-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>

      <form [formGroup]="form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
          <select formControlName="status" class="w-full border border-gray-300 rounded-lg p-2 text-sm bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
            <option value="">Todos los estados</option>
            @for (s of statuses; track s.value) {
              <option [value]="s.value">{{ s.label }}</option>
            }
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Prioridad</label>
          <select formControlName="priority" class="w-full border border-gray-300 rounded-lg p-2 text-sm bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
            <option value="">Todas las prioridades</option>
            @for (p of priorities; track p.value) {
              <option [value]="p.value">{{ p.label }}</option>
            }
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
          <select formControlName="category_id" class="w-full border border-gray-300 rounded-lg p-2 text-sm bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
            <option value="">Todas las categorías</option>
            @for (cat of categories(); track cat.id) {
              <option [value]="cat.id">{{ cat.name }}</option>
            }
          </select>
        </div>
      </form>

      <div class="mt-6 pt-4 border-t border-gray-100 flex justify-end">
        <button type="button" (click)="clearFilters()" class="text-sm font-medium text-red-600 hover:text-red-700">
          Limpiar todo
        </button>
      </div>
    </div>
  }
</div>
