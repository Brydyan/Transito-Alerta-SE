<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4 py-8">
  <div class="w-full max-w-md">
    <ui-card>
      <h1 class="text-2xl font-bold text-slate-900 mb-1">Verificá tu correo</h1>
      <p class="text-sm text-slate-500 mb-6">
        {{ hint() }}
      </p>

      <form [formGroup]="emailForm" (ngSubmit)="goToLogin()" data-testid="verify-email-form">
        <div class="space-y-4">
          <div>
            <label class="form-label" for="email">Correo</label>
            <input
              id="email"
              type="email"
              class="form-input w-full"
              formControlName="email"
              autocomplete="email"
              [readOnly]="isAuthenticated()"
              data-testid="email-input"
            />
            @if (emailCtrl.touched && emailCtrl.errors) {
              <p class="form-error">Revisá que el correo esté bien escrito.</p>
            }
          </div>
        </div>

        <div class="mt-6 flex flex-col gap-3">
          @if (!isAuthenticated()) {
            <!-- El alta pública no emite tokens (T6.5.D): el endpoint
                 /api/email/resend-verification exige JWT. La pantalla
                 lleva al login con el correo pre-rellenado; tras
                 autenticarse, el composer del OTP entra cuando F4
                 lo enchufe. -->
            <button
              type="submit"
              class="btn btn-primary w-full"
              [disabled]="emailCtrl.invalid"
              data-testid="go-to-login"
            >
              Iniciar sesión para verificar
            </button>
            <p class="text-sm text-slate-500 text-center">
              ¿Recordás tu contraseña?
              <a routerLink="/login" class="text-brand-primary font-medium ml-1">Iniciar sesión</a>
            </p>
          } @else {
            <p class="text-sm text-slate-700" data-testid="logged-in-message">
              Sesión activa. Cuando F4 habilite el composer del OTP,
              lo vas a ver en este mismo lugar.
            </p>
          }
        </div>
      </form>
    </ui-card>
  </div>
</div>
