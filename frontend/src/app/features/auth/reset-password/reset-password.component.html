<section class="h-screen flex m-0 p-0 overflow-hidden">
  <!-- Left Side: Full Bleed Image / Illustration -->
  <div class="hidden lg:block lg:w-1/2 xl:w-7/12 p-0 m-0 h-screen bg-brand-navy">
    <img
      src="../../../../../public/images/portada-panel-izq.png"
      class="w-full h-full object-cover block opacity-90 mix-blend-luminosity"
      alt="Fondo de la CTE"
    />
  </div>

  <!-- Right Side: Form Container -->
  <div class="w-full lg:w-1/2 xl:w-5/12 flex flex-col justify-center px-4 md:px-12 bg-bg-secondary h-screen relative">
    <div class="w-full mx-auto max-w-sm">
      <div class="mb-10 flex justify-center w-full">
        <img
          src="../../../../../public/images/logo.png"
          class="max-w-[150px] h-auto mb-4"
          alt="Logo"
        />
      </div>

      <h2 class="text-2xl font-bold text-slate-800 mb-2">Restablecer contraseña</h2>
      <p class="text-slate-500 text-sm mb-6">Ingresa tu nueva contraseña para actualizar tu acceso.</p>

      <form id="reset-form" novalidate>
        <div id="estado-exito" class="hidden bg-status-success/10 border border-status-success/30 text-status-success px-4 py-3 rounded mb-4 flex items-center gap-2 text-sm" role="alert">
          <i class="bi bi-check-circle-fill"></i>
          <span id="exito-texto">Tu contraseña ha sido restablecida exitosamente.</span>
        </div>

        <div id="estado-error" class="hidden bg-status-critical/10 border border-status-critical/30 text-status-critical px-4 py-3 rounded mb-4 flex items-center gap-2 text-sm" role="alert">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span id="error-texto">No se pudo restablecer la contraseña. El enlace puede haber expirado.</span>
        </div>

        <div class="mb-4 relative">
          <label class="form-label" for="password">Nueva contraseña</label>
          <input
            type="password"
            id="password"
            class="form-control pr-10"
            placeholder="Mínimo 6 caracteres"
            required
            minlength="6"
            autocomplete="new-password"
          />
          <button type="button" class="gr-input-eye absolute right-3 top-9 text-slate-400 hover:text-slate-600 focus:outline-none" aria-label="Mostrar contraseña">
            <i class="bi bi-eye"></i>
          </button>
        </div>

        <div class="mb-4 relative">
          <label class="form-label" for="password-confirm">Confirmar contraseña</label>
          <input
            type="password"
            id="password-confirm"
            class="form-control pr-10"
            placeholder="Confirmar contraseña"
            required
            minlength="6"
            autocomplete="new-password"
          />
          <button type="button" class="gr-input-eye absolute right-3 top-9 text-slate-400 hover:text-slate-600 focus:outline-none" aria-label="Mostrar contraseña">
            <i class="bi bi-eye"></i>
          </button>
        </div>

        <div class="mb-4 mt-6">
          <button
            type="submit"
            class="btn btn-primary w-full py-2.5 disabled:opacity-70 disabled:cursor-not-allowed"
            id="btn-restablecer"
          >
            <span id="btn-texto">Restablecer contraseña</span>
            <span id="btn-loading" class="hidden flex items-center">
              <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-brand-hivis-text" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Restableciendo...
            </span>
          </button>
        </div>

        <div class="text-center mt-6">
          <a
            href="#/login"
            class="text-slate-500 underline text-sm hover:text-brand-navy font-medium transition-colors inline-flex items-center gap-2"
          >
            <i class="bi bi-arrow-left"></i> Volver al inicio de sesión
          </a>
        </div>
      </form>
    </div>
  </div>
</section>
