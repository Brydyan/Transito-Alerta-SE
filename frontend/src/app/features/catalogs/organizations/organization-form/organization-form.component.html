<div class="p-4">
  <!-- Page Header -->
  <ui-page-header
    kicker="CATALOGS / ORGANIZATIONS"
    [title]="isEditing() ? 'Edit Organization' : 'New Organization'"
    [subtitle]="isEditing() ? 'Update the organization details below.' : 'Fill in the fields to create a new organization.'"
    [showActions]="false"
  />

  @if (isLoading()) {
    <div class="flex justify-center py-12">
      <div class="w-8 h-8 border-2 border-brand-primary border-r-transparent rounded-full animate-spin" role="status">
        <span class="sr-only">Loading...</span>
      </div>
    </div>
  } @else {
    <!-- Integrity error banner -->
    @if (integrityError()) {
      <div
        class="bg-amber-50 border border-amber-300 text-amber-800 px-4 py-3 rounded-lg mb-6 flex items-center gap-2"
        role="alert"
      >
        <ui-icon name="alert-triangle" [size]="18" />
        <span class="text-sm font-medium">This organization cannot be modified because it is referenced by other records.</span>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="border-none shadow-sm rounded-lg mb-6">
        <div class="p-6">
          <h6 class="font-semibold text-slate-500 mb-4 text-sm uppercase tracking-wider">
            Organization Details
          </h6>

          <div class="grid grid-cols-1 gap-4">
            <!-- Name -->
            <div>
              <label for="form-name" class="block text-sm font-medium text-slate-700 mb-1">
                Name <span class="text-red-500">*</span>
              </label>
              <input
                id="form-name"
                type="text"
                class="w-full px-3 py-2 text-sm border rounded-lg bg-bg-primary text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-primary/40 focus:border-brand-primary"
                [class.border-red-500]="fieldInvalid('name')"
                [class.focus:ring-red-500/40]="fieldInvalid('name')"
                placeholder="e.g. Transit Authority"
                formControlName="name"
              />
              @if (fieldError('name'); as msg) {
                <small class="text-red-500 text-xs mt-1 block">{{ msg }}</small>
              }
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="flex justify-end items-center">
        <div class="flex gap-3">
          <button
            type="button"
            uiButton
            variant="secondary"
            [disabled]="isSaving()"
            (click)="onCancel()"
          >
            Cancel
          </button>
          <button
            type="submit"
            uiButton
            variant="primary"
            [loading]="isSaving()"
            [disabled]="isSaving()"
          >
            {{ isEditing() ? 'Save Changes' : 'Create Organization' }}
          </button>
        </div>
      </div>
    </form>
  }
</div>
