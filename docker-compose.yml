# Local development services.
# Production uses managed Supabase (Postgres) and a managed Redis provider —
# this file exists so `pnpm run start:dev` has something to talk to locally.
#
#   docker compose up -d
#   docker compose ps
#   docker compose logs -f redis
#   docker compose down          # stop, keep data
#   docker compose down -v       # stop and DELETE volumes

services:
  redis:
    image: redis:7-alpine
    container_name: tase-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT}:6379'
    # appendonly: Streams are the event log for realtime assignment — losing
    # them on restart would drop events that consumers had not read yet.
    # maxmemory-policy noeviction: with cache on DB 1 and Streams on DB 0 in
    # the same instance, an LRU policy could evict Stream entries under
    # pressure. Cache entries expire on their own TTL instead.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgis/postgis:16-3.4
    container_name: tase-postgres
    restart: unless-stopped
    ports:
      - '${DB_PORT}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d transito_alerta']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  postgres-data:
