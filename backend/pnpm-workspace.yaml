packages: []

# 2026-10-18 — security (P1..P5) — `overrides` reemplazó al campo
# `pnpm.overrides` en package.json a partir de pnpm 10. Cada entrada
# fuerza una versión mínima para cerrar CVEs conocidos sin esperar a
# que las deps transitivas (express/nestjs) suban de versión.
#
# - proxy-addr >=2.0.8 — GHSA-jqcg-44mw-7w3h (CRITICAL: IP spoofing vía
#   IPv4-mapped IPv6 trust subnet, bypasea el RateLimiterGuard).
# - multer >=2.2.0     — DoS por cleanup incompleto en uploads abortados.
# - engine.io >=6.6.10 — Socket.IO protocol revision mismatch DoS.
# - tar >=7.4.3        — Path traversal hardlink chain.
# - nodemailer >=7.0.0 — addressparser DoS + bypass de file/url access.
#
# Documentado en odd/tasks/SECURITY_AUDIT_2026-10-18.md y
# odd/tasks/SECURITY_ACTION_PLAN_2026-10-18.md.
overrides:
  proxy-addr: ^2.0.8
  multer: ^2.2.0
  engine.io: ^6.6.10
  tar: ^7.4.3
  nodemailer: ^7.0.0

allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  bcrypt: true
  # ssh2/cpu-features are an optional transitive dep of testcontainers (SSH
  # tunnel support we don't use — we only spin up generic Postgres/Redis
  # containers over the local Docker socket). protobufjs is pure JS and
  # doesn't need a build step either. Skipping all three skips native
  # compilation with no loss of functionality for our use case.
  cpu-features: false
  protobufjs: false
  ssh2: false
