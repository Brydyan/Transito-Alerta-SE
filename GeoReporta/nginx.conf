# Standard top-level directives inherited from the upstream nginx:alpine
# default config. Required when overriding /etc/nginx/nginx.conf so the
# master can write its pid and the worker can read mime.types; the `events`
# block below is intentionally tuned for SSE-heavy workloads and overrides
# the upstream `worker_connections 1024` default.
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    # Tuned for SSE-heavy workloads. The native notification bell holds
    # one long-lived connection per logged-in user. Default 1024 caps
    # simultaneous client sockets per worker and silently chokes long
    # before the Swoole/Octane backend saturates. 4096 leaves headroom
    # for the API endpoints plus a generous SSE connection pool.
    # `multi_accept on` lets each worker accept all pending new
    # connections in one loop iteration instead of one at a time.
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Proxy timeouts and buffering for the SSE endpoint live inside the
    # `location /api/` block below. Per-worker connection accounting is
    # already covered by `worker_connections` in `events {}` above.

    server {
        listen 80;

    # Allow up to 1 MB request body. MUST stay in sync with
    # App\Domains\Users\Models\User::AVATAR_MAX_KB (800 KB) — keep nginx
    # limit >= User::AVATAR_MAX_KB + small margin so PHP validation can run.
    client_max_body_size 1m;

    # Compress text assets. Fonts (woff2) and images are already-compressed
    # formats — leaving them out avoids wasted CPU for ~0% gain.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Use Docker's internal DNS so upstream is resolved per-request, not at startup
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # The native SSE stream lives under /api/notifications/stream.
        # These three directives keep long-lived connections alive:
        #   proxy_buffering off  — flush each event as soon as the
        #                          upstream writes it; without it nginx
        #                          waits for an 4k–8k buffer to fill.
        #   proxy_cache off     — we never want a cached SSE event.
        #   proxy_read_timeout  — the default 60s cuts idle connections;
        #                          we set 1d to match heartbeat cadence
        #                          (the heartbeat itself re-arms the
        #                          timer, so dead connections surface
        #                          within NOTIFICATIONS_STREAM_HEARTBEAT_SECONDS).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
    }

    location /storage/ {
        set $backend http://backend:8000;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /nginx_status {
        stub_status;
        access_log off;
    }

    # Vite-hashed bundles plus vendor libs (extra-libs). Hashed files never
    # change under the same name; extra-libs only change on a manual vendor
    # upgrade, which ships with a deploy — 30 days is a safe ceiling.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Component templates/styles fetched at runtime by the SPA router.
    # no-cache = revalidate with ETag on every request (304 when unchanged),
    # so deploys are picked up immediately without re-downloading bytes.
    # try_files returns a real 404 instead of the SPA fallback masking
    # missing files as index.html (see the note in frontend/vite.config.js).
    location ~ ^/(app|css)/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
}
