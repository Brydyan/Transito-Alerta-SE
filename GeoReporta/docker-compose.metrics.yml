# =============================================================================
# E5 quality-metrics overlay — NOT part of the normal deploy.
# =============================================================================
#
# Serves quality-metrics/data/*.json over HTTP so the main `grafana` service's
# Infinity datasource (ops/grafana/provisioning/datasources/e5-infinity.yml)
# can read them at http://e5-metrics-data/. This is only needed when building
# the academic E5 metrics deliverable — the base stack runs without it.
#
# Run it as an overlay on top of the base compose so it joins the same
# `dev-network` as grafana:
#
#   docker compose -f docker-compose.yml -f docker-compose.metrics.yml up -d e5-metrics-data
#
# Tear down just this service:
#
#   docker compose -f docker-compose.yml -f docker-compose.metrics.yml down e5-metrics-data
#
services:
  e5-metrics-data:
    image: nginx:1.27-alpine
    volumes:
      - ./quality-metrics/data:/usr/share/nginx/html:ro
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge
