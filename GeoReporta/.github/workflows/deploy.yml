# ============================================
# Deploy - Sistema de Incidencias Georreferenciadas
# ============================================
# Runs on the self-hosted runner of the server, which is also the single
# Docker Swarm node. Builds images locally, then deploys deploy.yml as-is
# with `docker stack deploy`.
#
# Requirements:
#   - Configured self-hosted runner
#   - Docker Engine with Swarm mode active (`docker swarm init`, one-time
#     manual bootstrap — see docs/docker-swarm-guide.md)
#   - .env files placed in the runner workspace:
#     - Root .env (for deploy.yml variables)
#     - backend/.env (for Laravel/Swoole application secrets)
#     (clean: false preserves these between runs)
#
# NOTE: `docker stack deploy` does NOT read .env files the way
# `docker compose up` does (Compose feature only, not supported by Swarm)
# — it DOES interpolate ${VAR} from the process environment, so we export
# .env into the shell first. We deliberately do NOT pre-render the file
# with `docker compose config`: that round-trip rewrites `cpus: "0.5"` and
# short-form `ports:` into typed long-form YAML (float / string) that
# `docker stack deploy`'s stricter parser then rejects
# ("must be a string" / "must be a integer").
# ============================================

name: Deploy App

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          clean: false

      - name: Ensure environment files exist
        run: |
          if [ ! -f .env ]; then
            echo "❌ Root .env not found!"
            echo "Create it manually in the runner workspace root first."
            exit 1
          fi
          if [ ! -f backend/.env ]; then
            echo "❌ backend/.env not found!"
            echo "Create it manually in the runner workspace/backend/ first."
            exit 1
          fi

      - name: Ensure Swarm mode is active
        run: |
          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" != "active" ]; then
            echo "❌ Docker Swarm is not active on this host."
            echo "Run 'docker swarm init' manually once (see docs/docker-swarm-guide.md), then re-run this workflow."
            exit 1
          fi

      # Images are tagged with the commit SHA so every deploy changes the
      # service spec — Swarm skips updates when the image reference is
      # unchanged (a plain :latest tag makes deploys silent no-ops on a
      # single-node stack without a registry).
      - name: Build images
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose -f docker-compose.yml build backend frontend

      # Independent overlay network. `deploy.yml` declares it as
      # `external: true`, so the stack will NOT create it and would fail
      # to deploy if it doesn't exist on the Swarm host. We create it
      # here, idempotently, after images are built and before
      # `docker stack deploy`. `--attachable` lets standalone containers
      # (debug, one-off tooling) join the network without needing to
      # become Swarm services.
      #
      # On the existing-network path we re-validate driver/scope: a same-
      # named `bridge` or other non-overlay network would be silently
      # accepted here, and `docker stack deploy` would then fail with a
      # less actionable "is not in the right scope" message. Failing here
      # with the exact mismatch keeps the operator on the right path
      # (recreate the network rather than debugging stack errors).
      - name: Ensure overlay network exists
        run: |
          set -euo pipefail
          NETWORK_NAME=incidencias-network
          EXPECTED_SUBNET=10.240.0.0/24

          if ! docker network inspect "$NETWORK_NAME" >/dev/null 2>&1; then
            echo "Creating overlay network '$NETWORK_NAME'..."
            docker network create \
              --driver overlay \
              --subnet "$EXPECTED_SUBNET" \
              --attachable \
              "$NETWORK_NAME"
          fi

          EXISTING_DRIVER=$(docker network inspect \
            --format '{{.Driver}}' "$NETWORK_NAME")
          EXISTING_SCOPE=$(docker network inspect \
            --format '{{.Scope}}' "$NETWORK_NAME")
          EXISTING_ATTACH=$(docker network inspect \
            --format '{{.Attachable}}' "$NETWORK_NAME")
          EXISTING_SUBNETS=$(docker network inspect \
            --format '{{range .IPAM.Config}}{{.Subnet}},{{end}}' \
            "$NETWORK_NAME")

          if [ "$EXISTING_DRIVER" != "overlay" ] || \
             [ "$EXISTING_SCOPE" != "swarm" ] || \
             [ "$EXISTING_ATTACH" != "true" ] || \
             [ "$EXISTING_SUBNETS" != "${EXPECTED_SUBNET}," ]; then
            echo "::error::Network '$NETWORK_NAME' is incompatible: \
          driver=$EXISTING_DRIVER, scope=$EXISTING_SCOPE, \
          attachable=$EXISTING_ATTACH, subnets=$EXISTING_SUBNETS."
            echo "::error::Expected driver=overlay, scope=swarm, \
          attachable=true, subnet=$EXPECTED_SUBNET. Refusing to modify it."
            exit 1
          fi

          NETWORK_SUMMARY_FORMAT='{{.Name}} ({{.Driver}}, scope={{.Scope}}, '
          NETWORK_SUMMARY_FORMAT+='attachable={{.Attachable}}, '
          NETWORK_SUMMARY_FORMAT+='subnets={{range .IPAM.Config}}'
          NETWORK_SUMMARY_FORMAT+='{{.Subnet}} {{end}})'
          docker network inspect \
            --format "$NETWORK_SUMMARY_FORMAT" \
            "$NETWORK_NAME"

      - name: Deploy stack
        run: |
          set -a
          source .env
          set +a
          export IMAGE_TAG=${{ github.sha }}
          docker stack deploy -c deploy.yml incidencias-stack

      - name: Wait for stack convergence
        run: |
          set -euo pipefail
          STACK_NAME=incidencias-stack
          TIMEOUT_SECONDS=300
          POLL_INTERVAL_SECONDS=10

          EXPECTED_SERVICES_OUTPUT=$(
            docker compose -f deploy.yml config --services
          )
          if [ -z "$EXPECTED_SERVICES_OUTPUT" ]; then
            echo "::error::No services found in deploy.yml."
            exit 1
          fi

          declare -a EXPECTED_SERVICES=()
          while IFS= read -r SERVICE; do
            if [ -n "$SERVICE" ]; then
              EXPECTED_SERVICES+=("${STACK_NAME}_${SERVICE}")
            fi
          done <<< "$EXPECTED_SERVICES_OUTPUT"

          EXPECTED_SERVICE_COUNT=${#EXPECTED_SERVICES[@]}
          if [ "$EXPECTED_SERVICE_COUNT" -eq 0 ]; then
            echo "::error::No services found in deploy.yml."
            exit 1
          fi

          echo "Waiting up to ${TIMEOUT_SECONDS}s for \
          $EXPECTED_SERVICE_COUNT services to converge..."
          DEADLINE=$((SECONDS + TIMEOUT_SECONDS))
          CONVERGED=false
          declare -a LAST_NON_CONVERGED_SERVICES=("${EXPECTED_SERVICES[@]}")
          declare -a LAST_NON_CONVERGED_DETAILS=()
          UPDATE_STATE_FORMAT='{{if .UpdateStatus}}'
          UPDATE_STATE_FORMAT+='{{.UpdateStatus.State}}{{end}}'

          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            declare -a SERVICE_ROWS=()
            while IFS= read -r ROW; do
              if [ -n "$ROW" ]; then
                SERVICE_ROWS+=("$ROW")
              fi
            done < <(
              docker stack services \
                --format '{{.Name}}|{{.Mode}}|{{.Replicas}}' \
                "$STACK_NAME" 2>/dev/null || true
            )

            declare -a NON_CONVERGED_SERVICES=()
            declare -a NON_CONVERGED_DETAILS=()

            for EXPECTED_SERVICE in "${EXPECTED_SERVICES[@]}"; do
              FOUND=false
              for ROW in "${SERVICE_ROWS[@]}"; do
                IFS='|' read -r NAME MODE REPLICAS <<< "$ROW"
                if [ "$NAME" != "$EXPECTED_SERVICE" ]; then
                  continue
                fi

                FOUND=true
                STATUS_DETAIL=""
                if [[ "$REPLICAS" =~ ^([0-9]+)/([0-9]+)$ ]]; then
                  RUNNING=${BASH_REMATCH[1]}
                  DESIRED=${BASH_REMATCH[2]}
                  if [ "$DESIRED" -eq 0 ] || [ "$RUNNING" -ne "$DESIRED" ]; then
                    STATUS_DETAIL="$MODE $RUNNING/$DESIRED"
                  fi
                else
                  STATUS_DETAIL="$MODE invalid replicas: $REPLICAS"
                fi

                UPDATE_STATE=""
                if ! UPDATE_STATE=$(docker service inspect \
                  --format "$UPDATE_STATE_FORMAT" \
                  "$NAME" 2>/dev/null); then
                  STATUS_DETAIL="service inspect failed"
                elif [ -n "$UPDATE_STATE" ] && \
                     [ "$UPDATE_STATE" != "completed" ]; then
                  if [ -n "$STATUS_DETAIL" ]; then
                    STATUS_DETAIL+=", "
                  fi
                  STATUS_DETAIL+="update=$UPDATE_STATE"
                fi

                if [ -n "$STATUS_DETAIL" ]; then
                  NON_CONVERGED_SERVICES+=("$NAME")
                  NON_CONVERGED_DETAILS+=("$NAME ($STATUS_DETAIL)")
                fi
                break
              done

              if [ "$FOUND" = false ]; then
                NON_CONVERGED_SERVICES+=("$EXPECTED_SERVICE")
                NON_CONVERGED_DETAILS+=("$EXPECTED_SERVICE (missing)")
              fi
            done

            for ROW in "${SERVICE_ROWS[@]}"; do
              IFS='|' read -r NAME MODE REPLICAS <<< "$ROW"
              EXPECTED=false
              for EXPECTED_SERVICE in "${EXPECTED_SERVICES[@]}"; do
                if [ "$NAME" = "$EXPECTED_SERVICE" ]; then
                  EXPECTED=true
                  break
                fi
              done
              if [ "$EXPECTED" = false ]; then
                NON_CONVERGED_SERVICES+=("$NAME")
                NON_CONVERGED_DETAILS+=(
                  "$NAME ($MODE $REPLICAS, unexpected)"
                )
              fi
            done

            if [ "${#NON_CONVERGED_SERVICES[@]}" -eq 0 ] && \
               [ "${#SERVICE_ROWS[@]}" -eq "$EXPECTED_SERVICE_COUNT" ]; then
              CONVERGED=true
              break
            fi

            LAST_NON_CONVERGED_SERVICES=("${NON_CONVERGED_SERVICES[@]}")
            LAST_NON_CONVERGED_DETAILS=("${NON_CONVERGED_DETAILS[@]}")
            echo "Waiting: ${LAST_NON_CONVERGED_DETAILS[*]}"
            sleep "$POLL_INTERVAL_SECONDS"
          done

          if [ "$CONVERGED" != true ]; then
            echo "::error::Stack did not converge within ${TIMEOUT_SECONDS}s."
            docker stack services "$STACK_NAME" || true
            for SERVICE in "${LAST_NON_CONVERGED_SERVICES[@]}"; do
              echo "Service task history: $SERVICE"
              docker service ps --no-trunc "$SERVICE" || true
            done
            exit 1
          fi

          echo "Stack converged with all $EXPECTED_SERVICE_COUNT services."
          docker stack services "$STACK_NAME"

      - name: Clean up
        if: ${{ success() }}
        run: docker image prune -f
