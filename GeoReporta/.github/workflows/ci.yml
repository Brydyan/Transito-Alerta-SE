name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  frontend-quality:
    name: Frontend quality checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend format check
        run: npm run format

      - name: Check form utility class scope (SC-143)
        run: |
          ERRORS=0
          FORBIDDEN_CLASSES=(".gr-form-label" ".gr-input-wrap" ".gr-input-icon" ".gr-input-eye" ".gr-input-error" ".gr-input" ".gr-input--pad-right")

          for class in "${FORBIDDEN_CLASSES[@]}"; do
            # Search for class definitions (not just references)
            # Pattern: class name followed by { or , (indicating it's being defined)
            while IFS= read -r file; do
              if grep -E "${class}\s*[{,]" "$file" 2>/dev/null | grep -v '^\s*/\*'; then
                echo "ERROR: Shared form utility class '${class}' found defined in component CSS: $file"
                ERRORS=$((ERRORS + 1))
              fi
            done < <(find app -name "*.component.css")
          done

          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "CONTEXT: These classes must be defined EXCLUSIVELY in frontend/public/css/app.css"
            echo "REASON: SC-143 requires single source of truth for password field parity"
            echo "FIX: Remove the class definition from .component.css and reference from app.css"
            echo "SEE: https://github.com/Ali-Rr26/sistema-incidencias-georreferenciadas/issues/229"
            exit 1
          fi

  frontend-tests:
    name: Frontend tests (${{ matrix.suite }})
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, snapshot]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend suite
        run: npm run test:${{ matrix.suite }}

