services:
  # ==========================================
  # FRONTEND (Static Nginx Server)
  # ==========================================
  frontend:
    image: sistema-incidencias-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - dev-network
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /usr/share/nginx/html

  # ==========================================
  # BACKEND
  # ==========================================
  backend:
    image: sistema-incidencias-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DB_HOST: db
      # DB_PORT del contenedor `db` en la red docker — INTERNO, fijo.
      # DB_PORT del .env controla el mapping host:container del servicio
      # `db` (línea `${DB_PORT:-5432}:5432`); este `5432` es el puerto
      # que Postgres escucha DENTRO de la red y NO cambia con DB_PORT.
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # (see AppServiceProvider::FirebaseTokenVerifier). credentials_path
      # must be an absolute path INSIDE the container, i.e. under
      # /var/www/backend/storage/... — not a host path.
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_LEEWAY_SECONDS: ${FIREBASE_LEEWAY_SECONDS:-}
    volumes:
      - ./backend/app:/var/www/backend/app
      - ./backend/routes:/var/www/backend/routes
      - ./backend/config:/var/www/backend/config
      - ./backend/resources:/var/www/backend/resources
      - ./backend/database:/var/www/backend/database
      - ./backend/tests:/var/www/backend/tests
    develop:
      watch:
        - action: rebuild
          path: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - dev-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_CONNECTION: redis
      OCTANE_SERVER: ""
      LOG_CHANNEL: stderr_json
    volumes:
      - ./backend/routes:/var/www/backend/routes
      - ./backend/config:/var/www/backend/config
      - ./backend/resources:/var/www/backend/resources
      - ./backend/database:/var/www/backend/database
    command:
      - php
      - artisan
      - queue:work
      - redis
      - "--tries=3"
      - "--backoff=10"
      - "--max-time=3600"
      - "--sleep=3"
      - "--timeout=60"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dev-network

  # ==========================================
  # DATABASE
  # ==========================================
  db:
    image: ${POSTGIS_IMAGE:-postgis/postgis:17-3.5-alpine}
    command:
      - postgres
      - -c
      - max_connections=250
    environment:
      POSTGRES_DB: ${DB_DATABASE:-incidencias_db}
      POSTGRES_USER: ${DB_USERNAME:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" &&
          max_connections="$$(psql
          -U "$${POSTGRES_USER}"
          -d "$${POSTGRES_DB}"
          -Atqc 'SHOW max_connections')" &&
          test "$$max_connections" -ge 250
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dev-network

  # ==========================================
  # CACHE & QUEUE
  # ==========================================
  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    command:
      - redis-server
      - "--requirepass"
      - "${REDIS_PASSWORD}"
      - "--appendonly"
      - "yes"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - "${REDIS_PASSWORD}"
        - --no-auth-warning
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dev-network

  # ==========================================
  # RUSTFS S3-COMPATIBLE STORAGE
  # ==========================================
  # ─── RustFS Storage (S3-compatible, Apache 2.0) ──────────────────
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    container_name: sistema-s3-incidencias
    restart: unless-stopped
    user: root
    entrypoint: >
      /bin/sh -c "chown -R 10001:10001 /data && exec /entrypoint.sh rustfs"
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -s -o /dev/null -w "%{http_code}" http://localhost:9000/',
          "| grep -qE '200|403'",
        ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - dev-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ==========================================
  # CLOUDFLARE TUNNEL
  # ==========================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    networks:
      - dev-network

  # ==========================================
  # OBSERVABILITY
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - dev-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning
      - ./ops/dashboards:/var/lib/grafana/dashboards
      - ./ops/dashboards-k6:/var/lib/grafana/dashboards-k6
      - ./ops/dashboards-e5:/var/lib/grafana/dashboards-e5
      - grafana_data:/var/lib/grafana
    networks:
      - dev-network

  loki:
    image: grafana/loki:latest
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./ops/loki/loki.yml:/etc/loki/loki.yml
    networks:
      - dev-network

  promtail:
    image: grafana/promtail:latest
    user: root
    volumes:
      - ./ops/promtail/promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dev-network

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      # `db:5432` es el puerto INTERNO del contenedor en la red docker
      # (fijo). DB_PORT del .env controla el mapping host:container.
      # Conexión en vars separadas porque postgres_exporter acepta
      # DATA_SOURCE_HOST/USER/PASS/DB/PORT/SSLMODE individualmente, y
      # la URI completa DATA_SOURCE_NAME supera el límite de 80 chars.
      DATA_SOURCE_HOST: db
      DATA_SOURCE_PORT: "5432"
      DATA_SOURCE_USER: ${DB_USERNAME:-user}
      DATA_SOURCE_PASS: ${DB_PASSWORD:-password}
      DATA_SOURCE_DB: ${DB_DATABASE:-incidencias_db}
      DATA_SOURCE_SSLMODE: disable
    networks:
      - dev-network

  redis_exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: "redis:6379"
    networks:
      - dev-network

  # ==========================================
  # STATIC CODE ANALYSIS (SonarQube)
  # ==========================================
  # Standalone stack, deliberately NOT wired into Prometheus/Grafana/Loki —
  # SonarQube ships its own UI/dashboard (see ops/sonarqube/README.md).
  #
  # NOTE: SonarQube's embedded Elasticsearch requires the host kernel setting
  # vm.max_map_count >= 262144, or the sonarqube service will fail to start
  # (Elasticsearch bootstrap check failure). This is NOT set automatically.
  # On the host, run:
  #   sudo sysctl -w vm.max_map_count=262144
  # To persist across reboots, add `vm.max_map_count=262144` to /etc/sysctl.conf
  # (or a drop-in under /etc/sysctl.d/).
  sonarqube_db:
    image: ${SONARQUBE_DB_IMAGE:-postgres:17-alpine}
    # Override del puerto interno. La imagen `postgres:*-alpine` no expone
    # `POSTGRES_PORT` como env var; hay que pasar `-p <puerto>` al binario.
    # Si cambiás SONARQUBE_DB_PORT en .env, este `command` lo respeta.
    command: ["postgres", "-p", "${SONARQUBE_DB_PORT:-5432}"]
    environment:
      POSTGRES_DB: ${SONARQUBE_DB_DATABASE:-sonarqube}
      POSTGRES_USER: ${SONARQUBE_DB_USERNAME:-sonarqube}
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonarqube}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [
          "CMD-SHELL",
          # yamllint disable-line rule:line-length
          "pg_isready -U ${SONARQUBE_DB_USERNAME:-sonarqube} -d ${SONARQUBE_DB_DATABASE:-sonarqube} -p ${SONARQUBE_DB_PORT:-5432}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dev-network

  sonarqube:
    # Pinned to a specific Community Build release — floating tags like
    # `lts-community` can resolve to a build SonarQube's own update-center
    # later flags as inactive. Bump this manually when upgrading.
    image: ${SONARQUBE_IMAGE:-sonarqube:26.7.0.124771-community}
    depends_on:
      sonarqube_db:
        condition: service_healthy
    environment:
      # `sonarqube_db:${SONARQUBE_DB_PORT:-5432}` usa el puerto INTERNO
      # del contenedor sonarqube_db, parametrizable vía .env (default 5432).
      # yamllint disable-line rule:line-length
      SONAR_JDBC_URL: "jdbc:postgresql://sonarqube_db:${SONARQUBE_DB_PORT:-5432}/${SONARQUBE_DB_DATABASE:-sonarqube}"
      SONAR_JDBC_USERNAME: ${SONARQUBE_DB_USERNAME:-sonarqube}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonarqube}
    ports:
      - "${SONARQUBE_PORT:-9002}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9000/api/system/status",
          '| grep -q ''"status":"UP"''',
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - dev-network

volumes:
  db_data:
  redis_data:
  rustfs_data:
  grafana_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_db_data:

networks:
  dev-network:
    driver: bridge
