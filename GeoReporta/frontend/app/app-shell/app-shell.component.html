<!--
  appShell — unified responsive layout
  Single CSS-grid layout with role-aware chrome regions.
  - Sidebar visible on desktop (>=md), hidden on mobile
  - Bottom nav visible on mobile (<md), hidden on desktop
  - Role-based content via body[data-role="admin|citizen|guest"]
-->
<div class="app-shell">
  <header class="app-shell-header">
    <button
      type="button"
      class="app-shell-sidebar-toggle"
      id="app-shell-sidebar-toggle"
      aria-label="Alternar barra lateral"
      aria-controls="app-shell-sidebar"
      aria-expanded="true"
    >
      <i
        class="fa-solid fa-angles-left app-shell-sidebar-toggle__icon"
        aria-hidden="true"
      ></i>
    </button>

    <div class="app-shell-header__brand">
      <i class="fa-solid fa-location-dot"></i>
      <span class="app-shell-header__brand-name">GeoReporta</span>
    </div>

    <!-- Admin header: notifications + user menu dropdown -->
    <div class="app-shell-header__admin" data-show-on-role="admin">
      <div class="app-shell-bell-wrapper">
        <button
          class="app-shell-header__icon-btn"
          type="button"
          aria-label="Notificaciones"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="app-shell-bell-panel-admin"
          id="app-shell-bell-admin"
        >
          <i class="fa-regular fa-bell"></i>
          <span
            class="app-shell-header__notif-badge d-none"
            id="app-shell-bell-badge-admin"
            >0</span
          >
        </button>
        <div
          class="app-shell-user-menu__panel app-shell-bell-panel"
          id="app-shell-bell-panel-admin"
          hidden
        >
          <div class="app-shell-bell-panel__header">
            Notificaciones
            <button
              type="button"
              class="app-shell-bell-panel__markall"
              id="app-shell-bell-markall-admin"
            >
              Marcar todas
            </button>
          </div>
          <ul class="app-shell-bell-panel__list" id="app-shell-bell-list-admin">
            <li class="app-shell-bell-panel__empty">Sin notificaciones</li>
          </ul>
        </div>
      </div>
      <button class="app-shell-header__icon-btn" aria-label="Configuración">
        <i class="fa-solid fa-gear"></i>
      </button>
      <div class="app-shell-user-menu">
        <button
          class="app-shell-user-menu__trigger"
          id="app-shell-user-menu-trigger"
          type="button"
          aria-haspopup="menu"
          aria-expanded="false"
        >
          <span class="app-shell-user-menu__avatar" id="app-shell-user-avatar"
            >U</span
          >
          <span class="app-shell-user-menu__name" id="app-shell-user-name"
            >Usuario</span
          >
          <i class="fa-solid fa-chevron-down app-shell-user-menu__arrow"></i>
        </button>
        <ul
          role="menu"
          id="app-shell-user-menu-panel"
          class="app-shell-user-menu__panel"
          hidden
        >
          <li
            role="menuitem"
            tabindex="-1"
            id="app-shell-user-menu-profile"
            class="app-shell-user-menu__item"
          >
            Mi perfil
          </li>
          <li
            role="menuitem"
            tabindex="-1"
            id="app-shell-user-menu-logout"
            class="app-shell-user-menu__item app-shell-user-menu__item--logout"
            aria-disabled="false"
          >
            Cerrar sesión
          </li>
        </ul>
      </div>
    </div>

    <!-- Citizen header: notification bell + user menu dropdown -->
    <div class="app-shell-header__citizen" data-show-on-role="citizen">
      <div class="app-shell-bell-wrapper">
        <button
          class="app-shell-header__bell"
          id="app-shell-bell"
          type="button"
          aria-label="Notificaciones"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="app-shell-bell-panel"
        >
          <i class="fa-regular fa-bell"></i>
          <span
            class="app-shell-header__notif-badge d-none"
            id="app-shell-bell-badge"
            >0</span
          >
        </button>
        <div
          class="app-shell-user-menu__panel app-shell-bell-panel"
          id="app-shell-bell-panel"
          hidden
        >
          <div class="app-shell-bell-panel__header">
            Notificaciones
            <button
              type="button"
              class="app-shell-bell-panel__markall"
              id="app-shell-bell-markall"
            >
              Marcar todas
            </button>
          </div>
          <ul class="app-shell-bell-panel__list" id="app-shell-bell-list">
            <li class="app-shell-bell-panel__empty" id="app-shell-bell-empty">
              Sin notificaciones
            </li>
          </ul>
        </div>
      </div>
      <div class="app-shell-user-menu app-shell-user-menu--compact">
        <button
          class="app-shell-user-menu__trigger app-shell-user-menu__trigger--avatar"
          id="app-shell-citizen-menu-trigger"
          type="button"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-label="Menú de usuario"
        >
          <span class="app-shell-avatar__letter" id="app-shell-avatar">?</span>
        </button>
        <ul
          role="menu"
          id="app-shell-citizen-menu-panel"
          class="app-shell-user-menu__panel"
          hidden
        >
          <li
            role="menuitem"
            tabindex="-1"
            id="app-shell-citizen-menu-profile"
            class="app-shell-user-menu__item"
          >
            Mi perfil
          </li>
          <li
            role="menuitem"
            tabindex="-1"
            id="app-shell-citizen-menu-logout"
            class="app-shell-user-menu__item app-shell-user-menu__item--logout"
            aria-disabled="false"
          >
            Cerrar sesión
          </li>
        </ul>
      </div>
    </div>

    <!-- Guest header: login button -->
    <a
      href="#/login"
      class="app-shell-login-btn"
      id="app-shell-login-btn"
      data-show-on-role="guest"
    >
      Ingresar
    </a>
  </header>

  <aside class="app-shell-sidebar" id="app-shell-sidebar">
    <!-- Admin sidebar: full nav with sections (PRINCIPAL / GESTIÓN / CONFIGURACIÓN) -->
    <nav
      class="app-shell-sidebar__nav"
      id="app-shell-admin-sidebar"
      data-show-on-role="admin"
    >
      <ul class="app-shell-sidebar__list" id="app-shell-admin-menu-list">
        <!-- Renderizado dinámico desde GET /api/menus/my (ver app-shell.component.js → renderAdminMenu) -->
      </ul>
    </nav>

    <!-- Citizen sidebar: flat list, populated dynamically from /api/menus/my -->
    <nav
      class="app-shell-sidebar__nav"
      id="app-shell-citizen-sidebar"
      data-show-on-role="citizen"
    >
      <ul
        class="app-shell-sidebar__list app-shell-sidebar__list--flat"
        id="app-shell-citizen-menu-list"
      >
        <!-- Renderizado dinámico desde GET /api/menus/my (ver app-shell.component.js → renderSidebarMenu) -->
      </ul>
    </nav>
  </aside>

  <main class="app-shell-main">
    <div id="page-outlet"></div>
  </main>

  <nav class="app-shell-bottom-nav" id="app-shell-bottom-nav">
    <!-- T-3.4: Admin bottom nav - now DB-driven via renderBottomNavMenu -->
    <ul id="app-shell-bottom-nav-list" class="app-shell-bottom-nav-list"></ul>

    <!-- T-3.4 + Cleanup: Citizen bottom nav - DB-driven. The "+" plus
         button is now synthesized inside this <ul> at index 1 (between
         Feed and Perfil) by renderBottomNavMenu. It used to be a
         hardcoded sibling of the <ul>, but with display: contents the
         <ul> doesn't occupy a grid cell, so the sibling landed at the
         far-right slot 3/3 instead of the original centered slot 2/3. -->
    <ul
      id="app-shell-citizen-bottom-nav-list"
      class="app-shell-citizen-bottom-nav-list"
    ></ul>
  </nav>
</div>
