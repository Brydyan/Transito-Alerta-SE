<main
  class="operator-dashboard"
  id="operator-dashboard"
  aria-labelledby="operator-dashboard-title"
>
  <header class="operator-dashboard__header">
    <div class="operator-dashboard__heading">
      <span class="operator-dashboard__signal" aria-hidden="true"></span>
      <div>
        <h1
          id="operator-dashboard-title"
          data-i18n="operatorDashboard.title"
        ></h1>
        <p data-i18n="operatorDashboard.subtitle"></p>
      </div>
    </div>
    <div class="operator-dashboard__location-action">
      <button
        class="operator-dashboard__primary-action"
        id="operator-location-update"
        type="button"
        data-i18n-aria-label="operatorDashboard.location.update"
      >
        <i class="fa-solid fa-location-crosshairs" aria-hidden="true"></i>
        <span data-i18n="operatorDashboard.location.update"></span>
      </button>
      <p
        id="operator-location-status"
        class="operator-dashboard__action-status"
        aria-live="polite"
      ></p>
    </div>
  </header>

  <section
    class="operator-dashboard__filters"
    data-i18n-aria-label="operatorDashboard.filters.label"
  >
    <div class="operator-dashboard__field">
      <label
        for="operator-filter-start"
        data-i18n="operatorDashboard.filters.from"
      ></label>
      <input id="operator-filter-start" type="date" />
    </div>
    <div class="operator-dashboard__field">
      <label
        for="operator-filter-end"
        data-i18n="operatorDashboard.filters.to"
      ></label>
      <input id="operator-filter-end" type="date" />
    </div>
    <div class="operator-dashboard__field operator-dashboard__field--location">
      <label
        for="operator-filter-location"
        data-i18n="operatorDashboard.filters.location"
      ></label>
      <select id="operator-filter-location">
        <option
          value=""
          data-i18n="operatorDashboard.filters.allLocations"
        ></option>
      </select>
    </div>
    <div class="operator-dashboard__filter-actions">
      <button
        class="operator-dashboard__secondary-action"
        id="operator-filter-clear"
        type="button"
        data-i18n="operatorDashboard.filters.clear"
      ></button>
      <button
        class="operator-dashboard__primary-action"
        id="operator-filter-apply"
        type="button"
        data-i18n="operatorDashboard.filters.apply"
      ></button>
    </div>
  </section>

  <section
    class="operator-dashboard__error"
    id="operator-dashboard-error"
    role="alert"
    hidden
  >
    <div class="operator-dashboard__error-icon" aria-hidden="true">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <div>
      <h2 data-i18n="operatorDashboard.error.title"></h2>
      <p data-i18n="operatorDashboard.error.body"></p>
    </div>
    <button
      class="operator-dashboard__secondary-action"
      id="operator-dashboard-retry"
      type="button"
      data-i18n="operatorDashboard.common.retry"
    ></button>
  </section>

  <div
    class="operator-dashboard__skeleton"
    id="operator-dashboard-skeleton"
    aria-live="polite"
  >
    <span
      class="operator-dashboard__sr-only"
      data-i18n="operatorDashboard.common.loading"
    ></span>
    <div class="operator-dashboard__skeleton-stats">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="operator-dashboard__skeleton-panel">
      <span></span><span></span><span></span>
    </div>
    <div
      class="operator-dashboard__skeleton-panel operator-dashboard__skeleton-panel--short"
    >
      <span></span><span></span>
    </div>
  </div>

  <div
    class="operator-dashboard__content"
    id="operator-dashboard-content"
    hidden
  >
    <section class="operator-dashboard__stats" aria-live="polite">
      <article class="operator-stat operator-stat--assigned">
        <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
        <strong id="operator-stat-assigned">0</strong>
        <span data-i18n="operatorDashboard.stats.assigned"></span>
      </article>
      <article class="operator-stat operator-stat--pending">
        <i class="fa-regular fa-clock" aria-hidden="true"></i>
        <strong id="operator-stat-pending">0</strong>
        <span data-i18n="operatorDashboard.stats.pending"></span>
      </article>
      <article class="operator-stat operator-stat--progress">
        <i class="fa-solid fa-person-digging" aria-hidden="true"></i>
        <strong id="operator-stat-progress">0</strong>
        <span data-i18n="operatorDashboard.stats.inProgress"></span>
      </article>
      <article class="operator-stat operator-stat--resolved">
        <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
        <strong id="operator-stat-resolved">0</strong>
        <span data-i18n="operatorDashboard.stats.resolved"></span>
      </article>
      <article class="operator-stat operator-stat--average">
        <i class="fa-regular fa-hourglass-half" aria-hidden="true"></i>
        <strong id="operator-stat-average">—</strong>
        <span data-i18n="operatorDashboard.stats.average"></span>
        <small data-i18n="operatorDashboard.stats.averageCaption"></small>
      </article>
    </section>

    <aside
      class="operator-dashboard__gps-prompt"
      id="operator-dashboard-gps-prompt"
      hidden
    >
      <div class="operator-dashboard__gps-mark" aria-hidden="true">
        <i class="fa-solid fa-location-dot"></i>
      </div>
      <div>
        <h2 data-i18n="operatorDashboard.location.promptTitle"></h2>
        <p data-i18n="operatorDashboard.location.promptBody"></p>
      </div>
      <button
        class="operator-dashboard__primary-action"
        id="operator-location-enable"
        type="button"
        data-i18n="operatorDashboard.location.enable"
      ></button>
    </aside>

    <section
      class="operator-work-panel"
      aria-labelledby="operator-assigned-title"
    >
      <div class="operator-work-panel__header">
        <div>
          <h2
            id="operator-assigned-title"
            data-i18n="operatorDashboard.assigned.title"
          ></h2>
          <p data-i18n="operatorDashboard.assigned.subtitle"></p>
        </div>
      </div>
      <div class="operator-incident-list" id="operator-assigned-list"></div>
      <div class="operator-empty" id="operator-assigned-empty" hidden>
        <i class="fa-solid fa-clipboard-check" aria-hidden="true"></i>
        <h3 data-i18n="operatorDashboard.assigned.emptyTitle"></h3>
        <p data-i18n="operatorDashboard.assigned.emptyBody"></p>
      </div>
      <nav class="operator-pagination" id="operator-pagination" hidden>
        <button
          type="button"
          id="operator-page-previous"
          data-i18n="operatorDashboard.pagination.previous"
        ></button>
        <span id="operator-page-label" aria-live="polite"></span>
        <button
          type="button"
          id="operator-page-next"
          data-i18n="operatorDashboard.pagination.next"
        ></button>
      </nav>
    </section>

    <section
      class="operator-work-panel operator-work-panel--nearby"
      aria-labelledby="operator-nearby-title"
    >
      <div class="operator-work-panel__header">
        <div>
          <h2
            id="operator-nearby-title"
            data-i18n="operatorDashboard.nearby.title"
          ></h2>
          <p id="operator-nearby-subtitle"></p>
        </div>
        <i
          class="fa-solid fa-route operator-work-panel__route"
          aria-hidden="true"
        ></i>
      </div>
      <div class="operator-incident-list" id="operator-nearby-list"></div>
      <div class="operator-empty" id="operator-nearby-empty" hidden>
        <i class="fa-solid fa-map-location-dot" aria-hidden="true"></i>
        <h3 id="operator-nearby-empty-title"></h3>
        <p id="operator-nearby-empty-body"></p>
      </div>
    </section>
  </div>
</main>
