<div class="gr-page">
  <!-- Header -->
  <div class="gr-page__header">
    <div>
      <h1 class="gr-page__title" id="form-titulo">Nueva Categoría</h1>
      <nav class="gr-breadcrumb">
        <span class="gr-breadcrumb__item">Configuración</span>
        <span class="gr-breadcrumb__sep">/</span>
        <a
          href="#/categorias"
          class="gr-breadcrumb__item"
          style="text-decoration: none; color: inherit"
          >Categorías</a
        >
        <span class="gr-breadcrumb__sep">/</span>
        <span
          class="gr-breadcrumb__item gr-breadcrumb__item--active"
          id="breadcrumb-actual"
          >Crear</span
        >
      </nav>
    </div>
  </div>

  <!-- Form Card -->
  <div class="gr-card gr-form-card">
    <div style="padding: 28px 32px">
      <h5 class="mb-1 fw-bold text-dark" id="card-titulo">Nueva Categoría</h5>
      <p class="text-muted mb-4" style="font-size: 13px">
        Los campos marcados con <span class="text-danger">*</span> son
        obligatorios.
      </p>

      <form id="form-cat" novalidate>
        <input type="hidden" id="cat-id" />

        <!-- Sección: Definición de Categoría -->
        <h6 class="fw-bold text-primary mb-3 border-bottom pb-2">
          <i class="fas fa-folder me-2"></i>Definición de Categoría
        </h6>

        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label for="cat-nombre" class="form-label fw-semibold">
              Nombre de la Categoría <span class="text-danger">*</span>
            </label>
            <input
              type="text"
              class="form-control form-control-lg"
              id="cat-nombre"
              maxlength="100"
              required
              placeholder="Ej: Infraestructura Vial"
            />
            <div class="invalid-feedback">
              El nombre de categoría es obligatorio.
            </div>
          </div>
          <div class="col-md-6">
            <label for="cat-padre" class="form-label fw-semibold">
              Categoría Padre / Matriz
            </label>
            <select class="form-select form-select-lg" id="cat-padre">
              <option value="">-- Ninguna (Categoría Raíz) --</option>
            </select>
            <div class="form-text mt-1" style="font-size: 12px">
              Seleccione una categoría principal si esta es una subcategoría.
            </div>
          </div>
        </div>

        <!-- Acciones -->
        <div class="d-flex gap-2 pt-2 border-top">
          <button type="submit" class="gr-btn-primary" id="btn-guardar-cat">
            <span id="cat-btn-texto"
              ><i class="fas fa-save me-1"></i>Guardar Categoría</span
            >
            <span id="cat-btn-loading" class="d-none">
              <span class="spinner-border spinner-border-sm me-1"></span
              >Guardando...
            </span>
          </button>
          <a href="#/categorias" class="btn btn-outline-secondary px-4"
            >Cancelar</a
          >
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Toast Notifications -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
  <div
    id="toast-msg"
    class="toast align-items-center text-white border-0"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div class="d-flex">
      <div class="toast-body" id="toast-msg-texto"></div>
      <button
        type="button"
        class="btn-close btn-close-white me-2 m-auto"
        data-bs-dismiss="toast"
      ></button>
    </div>
  </div>
</div>
