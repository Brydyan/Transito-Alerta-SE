<div class="container-fluid py-4">
  <div
    class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-2"
  >
    <div>
      <h1 class="gr-page__title mb-0">Roles</h1>
      <small class="text-muted"
        >Administrá los roles del sistema y sus permisos.</small
      >
    </div>
    <button id="btn-nuevo-rol" class="btn btn-primary">
      <i class="fa-solid fa-plus me-1"></i> Nuevo rol
    </button>
  </div>

  <div class="card mb-3">
    <div class="card-body py-3">
      <div class="row g-2 align-items-end">
        <div class="col-md-6">
          <label for="filtro-buscar" class="form-label small mb-1"
            >Buscar</label
          >
          <input
            type="text"
            id="filtro-buscar"
            class="form-control"
            placeholder="Nombre del rol…"
            autocomplete="off"
          />
        </div>
        <div class="col-md-6 d-flex gap-2">
          <button id="btn-filtrar" class="btn btn-outline-primary">
            <i class="fa-solid fa-magnifying-glass me-1"></i> Filtrar
          </button>
          <button id="btn-limpiar" class="btn btn-outline-secondary">
            <i class="fa-solid fa-xmark me-1"></i> Limpiar
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="estado-cargando" class="text-center py-5 d-none">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="text-muted mt-2 mb-0">Cargando roles…</p>
  </div>

  <div id="estado-vacio" class="text-center py-5 d-none">
    <i class="fa-solid fa-user-shield fa-3x text-muted mb-3"></i>
    <p class="text-muted mb-0">No hay roles que coincidan con la búsqueda.</p>
  </div>

  <div id="estado-error" class="alert alert-danger d-none" role="alert">
    <i class="fa-solid fa-triangle-exclamation me-2"></i>
    No se pudieron cargar los roles.
    <button id="btn-reintentar" class="btn btn-sm btn-outline-danger ms-2">
      Reintentar
    </button>
  </div>

  <div id="contenedor-tabla" class="card d-none">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr>
            <th>Nombre</th>
            <th class="text-center" style="width: 180px">Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-body"></tbody>
      </table>
    </div>
    <div
      class="card-footer d-flex justify-content-between align-items-center flex-wrap gap-2"
    >
      <small id="info-resultados" class="text-muted"></small>
      <nav><ul id="paginacion" class="pagination pagination-sm mb-0"></ul></nav>
    </div>
  </div>

  <div id="contenedor-cards" class="d-md-none"></div>
</div>

<div
  class="modal fade"
  id="modal-eliminar"
  tabindex="-1"
  aria-labelledby="modal-eliminar-label"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-eliminar-label">Eliminar rol</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Cerrar"
        ></button>
      </div>
      <div class="modal-body">
        ¿Eliminar el rol <strong id="modal-eliminar-nombre"></strong>? Esta
        acción no se puede deshacer.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancelar
        </button>
        <button
          id="btn-confirmar-eliminar"
          type="button"
          class="btn btn-danger"
        >
          <span id="eliminar-texto">Eliminar</span>
          <span id="eliminar-loading" class="d-none">
            <span
              class="spinner-border spinner-border-sm"
              role="status"
              aria-hidden="true"
            ></span>
          </span>
        </button>
      </div>
    </div>
  </div>
</div>

<div
  id="toast-msg"
  class="toast align-items-center text-white border-0 position-fixed bottom-0 end-0 m-4"
  role="alert"
  aria-live="assertive"
  aria-atomic="true"
>
  <div class="d-flex">
    <div class="toast-body" id="toast-msg-texto"></div>
    <button
      type="button"
      class="btn-close btn-close-white me-2 m-auto"
      data-bs-dismiss="toast"
      aria-label="Cerrar"
    ></button>
  </div>
</div>
