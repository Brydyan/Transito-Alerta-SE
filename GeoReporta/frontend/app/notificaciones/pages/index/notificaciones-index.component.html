<div class="gr-page">
  <!-- Header -->
  <div class="gr-page__header">
    <div>
      <h1 class="gr-page__title">Notificaciones</h1>
      <nav class="gr-breadcrumb">
        <span class="gr-breadcrumb__item">Gestión</span>
        <span class="gr-breadcrumb__sep">/</span>
        <span class="gr-breadcrumb__item gr-breadcrumb__item--active"
          >Notificaciones</span
        >
      </nav>
    </div>
  </div>

  <!-- Tabs -->
  <ul class="nav nav-tabs mb-3" id="notif-tabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button
        class="nav-link active"
        data-tab="pending"
        id="tab-pending"
        type="button"
        role="tab"
        aria-controls="tab-content-pending"
        aria-selected="true"
      >
        Pendientes de aprobación
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button
        class="nav-link"
        data-tab="read"
        id="tab-read"
        type="button"
        role="tab"
        aria-controls="tab-content-read"
        aria-selected="false"
      >
        Leídas
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button
        class="nav-link"
        data-tab="all"
        id="tab-all"
        type="button"
        role="tab"
        aria-controls="tab-content-all"
        aria-selected="false"
      >
        Todas
      </button>
    </li>
  </ul>

  <!-- Filters -->
  <div class="gr-card gr-filters">
    <div class="gr-filters__selects">
      <div class="gr-select-wrap d-none" id="filtro-organizacion-wrap">
        <select class="gr-select" id="filtro-organizacion">
          <option value="">Organización</option>
        </select>
        <i class="fa-solid fa-chevron-down gr-select-arrow"></i>
      </div>
      <button type="button" class="gr-btn-filter" id="btn-filtrar">
        <i class="fa-solid fa-magnifying-glass"></i>Filtrar
      </button>
      <button
        type="button"
        class="gr-btn-filter gr-btn-filter--clear"
        id="btn-limpiar"
        title="Limpiar filtros"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

  <!-- Table card -->
  <div class="gr-card">
    <!-- Loading -->
    <div id="estado-cargando" class="gr-estado-center d-none">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="text-muted mt-2 mb-0">Cargando notificaciones...</p>
    </div>

    <!-- Empty -->
    <div id="estado-vacio" class="gr-estado-center d-none">
      <i class="fa-solid fa-bell-slash text-muted notif-index__state-icon"></i>
      <p class="text-muted mt-3 mb-1">No hay notificaciones.</p>
    </div>

    <!-- Error -->
    <div id="estado-error" class="gr-estado-center d-none">
      <i
        class="fa-solid fa-triangle-exclamation text-danger notif-index__state-icon"
      ></i>
      <p class="text-muted mt-3 mb-1">No se pudo conectar con el servidor.</p>
      <button type="button" class="gr-btn-outline mt-1" id="btn-reintentar">
        Reintentar
      </button>
    </div>

    <!-- Table content -->
    <div id="contenedor-tabla" class="d-none">
      <!-- Desktop table -->
      <div class="gr-table-wrap d-none d-md-block">
        <table class="gr-table">
          <thead>
            <tr>
              <th class="notif-index__col-read text-center" style="width: 40px">
                <!-- unread dot -->
              </th>
              <th>TÍTULO</th>
              <th class="notif-index__col-date">FECHA</th>
              <th class="notif-index__col-actions text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-body"></tbody>
        </table>
      </div>

      <!-- Mobile cards -->
      <div id="contenedor-cards" class="d-md-none p-3"></div>

      <!-- Pagination bar -->
      <div class="gr-table-footer">
        <small class="text-muted" id="info-resultados"></small>
        <nav>
          <ul class="pagination pagination-sm mb-0" id="paginacion"></ul>
        </nav>
      </div>
    </div>
  </div>
</div>

<!-- Reject modal -->
<div class="modal fade" id="modal-rechazar" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title text-danger">
          <i class="fa-solid fa-xmark-circle me-2"></i>Rechazar incidencia
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>
      </div>
      <div class="modal-body">
        <label for="rechazo-motivo" class="form-label">
          Motivo del rechazo <span class="text-danger">*</span>
        </label>
        <textarea
          class="form-control"
          id="rechazo-motivo"
          rows="3"
          placeholder="Explicá el motivo por el cual se rechaza esta incidencia..."
          required
        ></textarea>
        <div class="invalid-feedback">
          El motivo del rechazo es obligatorio.
        </div>
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-outline-secondary"
          data-bs-dismiss="modal"
        >
          Cancelar
        </button>
        <button
          type="button"
          class="btn btn-danger"
          id="btn-confirmar-rechazar"
        >
          <span id="rechazo-texto">Rechazar</span>
          <span id="rechazo-loading" class="d-none"
            ><span class="spinner-border spinner-border-sm me-1"></span
            >Rechazando...</span
          >
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3 notif-index__toast-wrapper">
  <div
    id="toast-msg"
    class="toast align-items-center text-white border-0"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div class="d-flex">
      <div class="toast-body" id="toast-msg-texto"></div>
      <button
        type="button"
        class="btn-close btn-close-white me-2 m-auto"
        data-bs-dismiss="toast"
      ></button>
    </div>
  </div>
</div>
