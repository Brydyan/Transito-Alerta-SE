<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sistema de Incidencias Georreferenciadas</title>

    <!-- ── Critical CSS (blocking) ──────────────────── -->
    <link
      href="/assets/extra-libs/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/css/variables.css" rel="stylesheet" />
    <link href="/css/app.css" rel="stylesheet" />
    <link href="/css/mobile-responsive.css" rel="stylesheet" />

    <!-- ── Google Fonts (display=swap evita FOUT) ──── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"

    />

    <!-- Non-critical CSS (diferido via print hack) -->
    <link
      href="/assets/extra-libs/font-awesome-6/css/all.min.css"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <link
      href="/assets/extra-libs/tom-select/css/tom-select.bootstrap5.min.css"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />

      <link
        href="/assets/extra-libs/font-awesome-6/css/all.min.css"
        rel="stylesheet"
      />
      <link
        href="/assets/extra-libs/tom-select/css/tom-select.bootstrap5.min.css"
        rel="stylesheet"
      />
    </noscript>

  <body>
    <div id="shell-outlet"></div>

    <!-- Auth pages (login, etc.) — full page, no shell -->

    <!-- Bootstrap JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Feather Icons SVG replacement -->
    <!-- Tom Select JS -->
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
    <!-- App bootstrap (ES modules) -->
    <script type="module" src="/app/app.js"></script>
  </body>
</html>
