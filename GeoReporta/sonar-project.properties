sonar.projectKey=sistema-incidencias-georreferenciadas
sonar.projectName=Sistema de Incidencias Georreferenciadas

# Monorepo: backend (Laravel/PHP) + frontend (Vue-ish JS, Vitest)
sonar.sources=backend/app,frontend/app
sonar.tests=backend/tests,frontend/app

# Test files live alongside source in the frontend, so they are included in
# sonar.sources above; these inclusion patterns tell Sonar which of those
# files are tests rather than production source.
sonar.test.inclusions=backend/tests/**/*,frontend/app/**/*.test.js,frontend/app/**/__tests__/**/*.spec.js,frontend/app/**/*.integration.test.js,frontend/app/**/*.snapshot.test.js

sonar.exclusions=**/vendor/**,**/node_modules/**,backend/database/migrations/**,backend/database/seeders/**,backend/database/factories/**,backend/bootstrap/cache/**,backend/storage/**,frontend/coverage/**,backend/coverage/**,plantilla_Frontend/**

# Coverage reports (generated by `composer test:coverage` and
# `npm run test:coverage` — see ops/sonarqube/README.md)
sonar.php.coverage.reportPaths=backend/coverage/clover.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
