services:
  influxdb:
    image: influxdb:1.8
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: k6

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3100:3000"
    depends_on:
      - influxdb
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"

  k6:
    image: grafana/k6:latest
    volumes:
      - ./k6:/scripts
    environment:
      K6_OUT: influxdb=http://influxdb:8086/k6
    # Comando: docker compose -f load-tests/docker-compose.k6.yml run k6 run /scripts/scenarios/auth-login.js
    # Depende de influxdb para que K6_OUT tenga a quién escribir
    depends_on:
      - influxdb
