name: Deploy — Staging

on:
  push:
    branches: [develop]

# Un deploy a la vez — no cancelar si hay uno en curso, esperar que termine.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to staging
    runs-on: self-hosted
    environment: staging

    steps:
      # Code está en /mnt/storage/projects/tase/ (clonado manualmente, actualizar con git pull)

      - name: Detect database changes
        id: db_changes
        working-directory: /mnt/storage/projects/tase
        run: |
          if git diff HEAD~1..HEAD --quiet -- database/migrations/ database/seeds/; then
            echo "has_db_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_db_changes=true" >> $GITHUB_OUTPUT
          fi

      # El filtro `name=tase-` matchea TODO: tase-backend, tase-frontend,
      # tase-postgres y tase-redis. Correrlo sin condicionar destruía la base
      # en cada deploy aunque no hubiera cambios de esquema — el arranque de
      # infra estaba condicionado y la parada no, así que postgres sólo revivía
      # de rebote por `depends_on` al levantar backend. Los datos sobrevivían
      # (los volúmenes son nombrados y no se borran) pero cada deploy pagaba una
      # recreación completa de la base y su ventana de caída, que es justo lo
      # que la detección de cambios existe para evitar.
      - name: Stop old app containers (preserve infra when the DB didn't change)
        run: |
          if [ "${{ steps.db_changes.outputs.has_db_changes }}" = "true" ]; then
            echo "Cambios de BD: se recrea todo, incluida la infra"
            docker ps -a --filter "name=tase-" -q | xargs -r docker rm -f || true
          else
            echo "Sin cambios de BD: sólo backend y frontend; postgres y redis siguen vivos"
            docker ps -a \
              --filter "name=tase-backend" \
              --filter "name=tase-frontend" \
              -q | xargs -r docker rm -f || true
          fi

      # Sin condicionar: `up -d` es idempotente — si postgres y redis ya están
      # corriendo y sanos, no hace nada. Antes esto estaba detrás de
      # has_db_changes, lo que dejaba la infra sin garantía de estar levantada
      # en los deploys que no tocaban database/.
      - name: Ensure infra (postgres + redis)
        working-directory: /mnt/storage/projects/tase
        run: docker compose --progress quiet up -d postgres redis

      - name: Wait for postgres
        working-directory: /mnt/storage/projects/tase
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U postgres; then
              echo "Postgres listo tras ${i} intentos"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: postgres no respondió"
          exit 1

      # El defecto que rompió staging: la condición miraba el DIFF DE GIT, no el
      # ESTADO REAL de la base. Un volumen nuevo más un deploy que no tocaba
      # database/ dejaba la base vacía para siempre — el backend arrancaba y
      # moría con `relation "roles" does not exist`, y el deploy sólo decía
      # "container tase-backend is unhealthy".
      #
      # Ahora se pregunta si el esquema existe. `to_regclass` devuelve NULL
      # cuando la tabla no está, sin lanzar error.
      - name: Detect schema state
        id: schema
        working-directory: /mnt/storage/projects/tase
        run: |
          if docker compose exec -T postgres psql -U postgres -d transito_alerta \
               -tAc "SELECT to_regclass('public.roles') IS NOT NULL" 2>/dev/null \
               | tr -d '[:space:]' | grep -qx 't'; then
            echo "present=true" >> $GITHUB_OUTPUT
            echo "Esquema presente"
          else
            echo "present=false" >> $GITHUB_OUTPUT
            echo "Esquema AUSENTE — se migrará aunque el diff no toque database/"
          fi

      - name: Apply migrations — si cambió database/ o falta el esquema
        if: |
          steps.db_changes.outputs.has_db_changes == 'true' ||
          steps.schema.outputs.present == 'false'
        working-directory: /mnt/storage/projects/tase
        env:
          BOOTSTRAP: ${{ steps.schema.outputs.present == 'false' }}
        run: |
          # Con el esquema ausente (bootstrap) toda migración DEBE aplicar: un
          # fallo acá deja la base a medias y el backend no arranca, así que se
          # corta. Con el esquema ya presente se toleran los errores de las
          # migraciones ya aplicadas — no hay tracking en schema_migrations
          # todavía, así que re-aplicarlas falla por diseño.
          failed=0
          for file in database/migrations/[0-9]*.sql; do
            echo "── $(basename "$file")"
            if ! docker compose exec -T postgres psql \
                 -U postgres -d transito_alerta \
                 -v ON_ERROR_STOP=1 -q < "$file"; then
              if [ "$BOOTSTRAP" = "true" ]; then
                echo "::error::$(basename "$file") falló durante el bootstrap"
                exit 1
              fi
              failed=$((failed + 1))
            fi
          done
          echo "Migraciones procesadas · $failed con error (esperable si ya estaban aplicadas)"

      - name: Verify schema after migrations
        if: |
          steps.db_changes.outputs.has_db_changes == 'true' ||
          steps.schema.outputs.present == 'false'
        working-directory: /mnt/storage/projects/tase
        run: |
          # Sin esto, un bootstrap a medias se descubre recién cuando el backend
          # muere por `relation ... does not exist`, sin decir cuál falta.
          for t in roles users incidents user_sessions; do
            if ! docker compose exec -T postgres psql -U postgres -d transito_alerta \
                 -tAc "SELECT to_regclass('public.$t') IS NOT NULL" \
                 | tr -d '[:space:]' | grep -qx 't'; then
              echo "::error::falta la tabla '$t' después de migrar"
              exit 1
            fi
          done
          echo "Esquema verificado: roles, users, incidents, user_sessions"

      - name: Build and start backend + frontend
        working-directory: /mnt/storage/projects/tase
        env:
          CI: true
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # --quiet-pull y --progress quiet: sin esto, el progreso de descarga
          # capa por capa produce miles de líneas ("Downloading 1.049MB"
          # repetido) que entierran cualquier error real del build. Los errores
          # siguen saliendo; lo que se calla es la barra de progreso.
          docker compose --progress quiet --profile staging up \
            --build --quiet-pull -d backend frontend

      # `if: failure()` para que corra aunque el paso anterior aborte. Sin esto
      # el volcado de logs vivía sólo dentro de "Health check — backend", que no
      # llega a ejecutarse cuando `compose up` sale con error: el deploy fallaba
      # con una línea ("container tase-backend is unhealthy") y ningún dato para
      # diagnosticar. `|| true` en cada comando para que un fallo acá no tape la
      # causa real del fallo original.
      - name: Diagnóstico — sólo si algo falló
        if: failure()
        working-directory: /mnt/storage/projects/tase
        run: |
          echo "───── estado de los contenedores ─────"
          docker ps -a --filter "name=tase-" \
            --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true

          for c in tase-backend tase-frontend tase-postgres tase-redis; do
            echo
            echo "───── $c · healthcheck ─────"
            docker inspect "$c" --format '{{json .State.Health}}' 2>/dev/null \
              | python3 -m json.tool 2>/dev/null || echo "(sin healthcheck o contenedor ausente)"
            echo "───── $c · últimas 80 líneas ─────"
            docker logs "$c" --tail=80 2>&1 || true
          done

      - name: Health check — backend
        run: |
          set -a; source .env; set +a
          PORT=${APP_PORT:-3004}
          echo "Health check → http://localhost:${PORT}/api/health"
          for i in $(seq 1 15); do
            if curl -sf "http://localhost:${PORT}/api/health" > /dev/null; then
              echo "Backend healthy"
              exit 0
            fi
            echo "Attempt ${i}/15 — waiting 4s..."
            sleep 4
          done
          echo "Health check failed — last 50 lines:"
          docker compose logs backend --tail=50
          exit 1

      - name: Health check — frontend
        run: |
          set -a; source .env; set +a
          FRONTEND_PORT=${FRONTEND_PORT:-80}
          echo "Health check → http://localhost:${FRONTEND_PORT}"
          for i in $(seq 1 10); do
            if curl -sf "http://localhost:${FRONTEND_PORT}" > /dev/null; then
              echo "Frontend healthy"
              exit 0
            fi
            echo "Attempt ${i}/10 — waiting 2s..."
            sleep 2
          done
          echo "Health check failed — last 50 lines:"
          docker compose logs frontend --tail=50
          exit 1

      # T8 — Cutover rehearsal NO corre en cada push a develop. Se dispara
      # manualmente desde la UI de GitHub Actions vía el workflow
      # `rehearsal-staging.yml` cuando estás a punto de hacer el cutover
      # real (sea a staging final o a producción). Razón: el rehearsal
      # pega contra Supabase staging con checks pesados (R26.4 corre
      # test:e2e:cutover completo, ~5 min) y no tiene sentido en cada
      # push de feature. Ver `docs/runbooks/cutover.md` §"Rehearsal"
      # para cuándo invocarlo.
