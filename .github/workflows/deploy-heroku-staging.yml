name: Deploy — Heroku Staging

# Despliega a Heroku en cada push a develop
# Reemplaza el viejo `deploy-staging.yml` (Proxmox self-hosted runner)
on:
  push:
    branches: [develop]

concurrency:
  group: deploy-heroku-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Heroku
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: tase-staging
        run: |
          git remote add heroku https://git.heroku.com/${HEROKU_APP_NAME}.git || true
          git push https://oauth:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git develop:main
          echo "✅ Deploy triggered"

      - name: Verify deployment
        env:
          HEROKU_APP_NAME: tase-staging
        run: |
          echo "Waiting for app to be ready..."
          for i in $(seq 1 30); do
            if curl -sf "https://${HEROKU_APP_NAME}.herokuapp.com/api/health" > /dev/null 2>&1; then
              echo "✅ App is healthy"
              exit 0
            fi
            echo "Attempt ${i}/30 — waiting 3s..."
            sleep 3
          done

          echo "⚠️  App health check timeout (may still be starting)"
          exit 0

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Heroku deployment failed"
          echo "Check logs: https://dashboard.heroku.com/apps/tase-staging/logs"
