name: CI

# Gate for every PR and for pushes to the long-lived branches. Nothing here
# deploys — it only decides whether a change is allowed to merge.
on:
  pull_request:
    # `edited` es obligatorio por culpa de auto-redirect-pr.yml. Sin él, los
    # tipos por defecto son [opened, synchronize, reopened], y cambiar la
    # rama base por API dispara `edited`, no `synchronize`. Secuencia del
    # fallo, que ya se dio:
    #   1. PR contra main            -> `opened`, CI corre contra main
    #   2. el bot redirige a develop -> `edited`, este workflow lo ignoraba
    #   3. el PR queda mostrando checks calculados contra la base VIEJA
    # Y como dorny/paths-filter compara contra la base del PR, los jobs se
    # saltaban cuando el diff contra main no tocaba sus paths — en gris, que
    # se lee igual que "no corrió".
    #
    # Coste: `edited` también dispara al editar título o descripción. Lo
    # amortiguan el `concurrency` de abajo (cancela la corrida anterior) y el
    # job `changes`, que deja un PR sin paths relevantes en ~10s.
    types: [opened, synchronize, reopened, edited]
    branches: [develop, main]
  push:
    branches: [develop, main]
  # Auditoría nocturna de cutover: prueba que el camino de cutover sigue
  # funcionando el día antes de cualquier cutover real. 02:00 UTC = 21:00 ECT.
  # La consume el job `cutover-nightly` vía `if: github.event_name == 'schedule'`.
  schedule:
    - cron: '0 2 * * *'

# A new push to the same PR cancels the previous run; only the latest commit
# needs an answer.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Path filter (única fuente de verdad sobre qué dispara CI) ───────────────
  # Este job SIEMPRE corre; sólo produce booleanos que el resto usa para
  # saltarse cuando el cambio no es relevante. Antes los 3 jobs (backend,
  # integration, migrations) corrían en cada PR incluso cuando el cambio
  # era sólo de docs, lo que costaba ~7-9 min por PR sin valor. Ahora un
  # PR docs-only (docs/, openspec/, AGENTS.md, etc.) termina en ~10s.
  #
  # IMPORTANTE: en push (merge a develop/main) SIEMPRE corre todo, como
  # última red de seguridad. Si el filtro se desconfigura, los PRs pasan
  # por el gate "backend" en el push, no se va nada a producción sin
  # haber sido probado.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      migrations: ${{ steps.filter.outputs.migrations }}
      integration: ${{ steps.filter.outputs.integration }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 es necesario para que dorny/paths-filter compare
          # contra el merge-base del PR, no contra el último commit.
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # dorny/paths-filter@v3 cambió la API: las listas de paths se
          # pasan dentro de un único input `filters` (YAML o JSON), no como
          # inputs por nombre. Cada clave top-level (backend, migrations,
          # integration) se expone como un output con el mismo nombre
          # (steps.filter.outputs.<clave>).
          #
          # Sets:
          # - backend:    paths que afectan al backend (lint, typecheck, build,
          #               test, deploy). Olvidar uno es un fallo silencioso:
          #               el PR pasa en verde y se rompe en deploy.
          #               - backend/**            código, tests, config
          #               - database/**           migrations, seeds, rollback
          #                                        (e2e las aplican; rebuild-feed.ts
          #                                        importa database/seeds/lib/guard)
          #               - compose.yaml          contexto de build del backend
          #               - .dockerignore          exclusiones del contexto
          #               - backend/Dockerfile    COPY paths, layers, CMD
          #               - .github/workflows/ci.yml   self-change del propio CI
          # - migrations: paths que requieren reaplicar migraciones sobre BD limpia
          # - integration: paths que requieren correr la suite e2e (Testcontainers)
          filters: |
            backend:
              - 'backend/**'
              - 'database/**'
              - 'compose.yaml'
              - '.dockerignore'
              - 'backend/Dockerfile'
              - '.github/workflows/ci.yml'
            migrations:
              - 'database/migrations/**'
              - 'database/rollback/**'
            integration:
              - 'backend/**'
              - 'database/**'
            frontend:
              - 'frontend/**'
              - 'frontend/.eslintrc*'
              - 'frontend/eslint.config.*'
              - '.github/workflows/ci.yml'
          # list-files: none evita que la acción imprima la lista de
          # archivos cambiados en el log (ruido puro en PRs grandes).
          # initial-fetch-depth: 100 es más eficiente que 0 para PRs largos
          # (dorny sólo necesita el último commit del merge-base para
          # comparar paths, no todo el historial).
          list-files: none
          initial-fetch-depth: 100

  backend:
    # En push (merge a develop/main) SIEMPRE corre. En PR, sólo si el
    # filtro `changes` detectó paths del set `backend`.
    needs: changes
    if: |
      github.event_name == 'push' ||
      needs.changes.outputs.backend == 'true'
    name: Backend — lint, typecheck, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # The action reads `packageManager` from the REPO ROOT by default,
          # and there is no package.json there. `defaults.run.working-directory`
          # only applies to `run:` steps, never to a `uses:` input — so this
          # path has to be spelled out or the install fails with
          # "No pnpm version is specified".
          package_json_file: backend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      # --frozen-lockfile fails instead of silently resolving different
      # versions when the lockfile is out of date with package.json.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm run build

      - run: pnpm test

  integration:
    name: Integration — e2e ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # Skip en PR si nada del set `integration` cambió. En push SIEMPRE
    # corre como gate final. Reemplaza el filtro anterior (que sólo
    # discriminaba por nombre de rama) por el path filter real.
    needs: changes
    if: |
      github.event_name == 'push' ||
      needs.changes.outputs.integration == 'true'

    # sc-330 — la suite e2e se PARTICIONA en cuatro, no se recorta.
    #
    # `test-environment.ts` levanta un PostGIS y un Redis por archivo de
    # spec (su propio comentario: "una instancia por archivo"), y
    # `jest-e2e.json` fija `maxWorkers: 1`. Con 50 archivos eso son ~11
    # minutos en serie, y crece con cada spec nuevo.
    #
    # `--shard=N/4` reparte los ARCHIVOS entre cuatro corredores. Los
    # cuatro juntos ejecutan exactamente la misma suite que antes: esto
    # divide el trabajo, no lo reduce. Recortar la suite en la compuerta
    # de merge sería lo contrario de lo que la compuerta existe para
    # hacer — es el único sitio donde nadie va a mirar lo que se saltó.
    #
    # Es seguro porque no hay estado compartido entre archivos: cada uno
    # trae sus propios contenedores y los tira al terminar. Por eso mismo
    # el particionado no ahorra arranques de contenedor, sólo los pone en
    # paralelo. Bajar ese coste pide reutilizar contenedores entre
    # archivos, que es la deuda que el propio `test-environment.ts`
    # anota ("revisar si ese supuesto deja de valer" — ya dejó de valer,
    # con 50 archivos).
    #
    # `fail-fast: false` para ver TODAS las particiones que fallan en una
    # corrida. Con el valor por defecto, la primera en romperse cancela
    # las otras tres y el informe queda incompleto justo cuando más hace
    # falta.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    defaults:
      run:
        working-directory: backend

    # This job exists for the same reason `migrations` does: the unit suite
    # mocks every module boundary, and seven defects shipped in Phases 1-2
    # each lived on a seam its unit test mocked away (docs/CI_CD.md, T4.1).
    # `pnpm run test:e2e` (backend/test/support/test-environment.ts) starts
    # real postgis/postgis and redis containers via Testcontainers, applies
    # database/migrations/[0-9]*.sql the same way the `migrations` job does,
    # and boots the Nest app wired exactly like main.ts — ubuntu-latest
    # ships Docker already running, which is all Testcontainers needs; no
    # `services:` block, it manages its own containers.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # SIN el separador `--`, y no es un descuido: pnpm lo reenvía LITERAL
      # al comando de abajo en vez de consumirlo (npm sí lo consume). El `--`
      # llega a jest como primer argumento posicional, su parser deja de
      # reconocer `--shard=N/4` como opción y lo trata como patrón de ruta:
      #
      #   $ pnpm run test:e2e -- --shard=1/4
      #   Pattern: --shard=1/4 - 0 matches
      #   No tests found, exiting with code 1
      #
      # Las cuatro particiones fallarían así en cada push, en rojo y sin
      # haber ejecutado un solo test. Si alguien "arregla" esto volviendo a
      # poner el `--`, eso es lo que rompe.
      - run: pnpm run test:e2e --shard=${{ matrix.shard }}/4

  # sc-330 — Agregador. Existe SÓLO para conservar el nombre de check que
  # tenía el job `integration` antes de particionarse.
  #
  # Al añadir una matriz, GitHub renombra los checks a "… (1)", "… (2)"…
  # Si `develop` o `main` exigen la comprobación con el nombre viejo, esos
  # checks dejan de existir y los PR se quedan esperando indefinidamente
  # uno que nunca va a llegar — bloqueados sin un error que lo explique.
  # Este job mantiene el contrato: mismo nombre, verde sólo si las cuatro
  # particiones pasaron.
  #
  # `if: always()` es obligatorio: sin él, el agregador se salta cuando se
  # salta `integration`, y un check requerido que se salta bloquea igual.
  # Por eso la condición distingue "skipped" (correcto: el PR no tocó nada
  # de integración) de "failure"/"cancelled" (no correcto).
  integration-gate:
    name: Integration — e2e harness against real Postgres+PostGIS and Redis
    runs-on: ubuntu-latest
    needs: integration
    if: always()
    steps:
      - name: Comprobar el resultado de las cuatro particiones
        run: |
          echo "resultado de integration: ${{ needs.integration.result }}"
          case "${{ needs.integration.result }}" in
            success|skipped) echo "OK"; exit 0 ;;
            *)               echo "alguna partición no pasó"; exit 1 ;;
          esac

  migrations:
    name: Migrations — apply to a clean PostGIS database
    runs-on: ubuntu-latest
    # Skip en PR si no hay cambios en migrations/rollback. En push
    # SIEMPRE corre — la suite de checks de PostGIS y FK es la red de
    # seguridad contra migraciones que rompen el esquema antes de que
    # un humano las pegue en el editor SQL de Supabase (CC3).
    needs: changes
    if: |
      github.event_name == 'push' ||
      needs.changes.outputs.migrations == 'true'

    # Migrations are applied BY HAND to Supabase (design CC3). Nothing runs
    # them automatically, so nothing would catch a broken file before it is
    # pasted into a production SQL editor. This job is that check: every
    # migration, in order, against an empty database.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: transito_alerta
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Apply every migration in numeric order
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for file in database/migrations/[0-9]*.sql; do
            echo "── $(basename "$file")"
            psql -h localhost -U postgres -d transito_alerta \
                 -v ON_ERROR_STOP=1 -q -f "$file"
          done

      - name: Verify the resulting schema
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d transito_alerta -v ON_ERROR_STOP=1 <<'SQL'
          -- PostGIS present and geo_zones typed as MultiPolygon.
          SELECT postgis_version();
          DO $$
          DECLARE geom_type text;
          BEGIN
            SELECT type INTO geom_type
              FROM geometry_columns
             WHERE f_table_name = 'geo_zones';
            IF geom_type IS DISTINCT FROM 'MULTIPOLYGON' THEN
              RAISE EXCEPTION 'geo_zones.polygon must be MULTIPOLYGON, got %', geom_type;
            END IF;
          END $$;

          -- Santa Elena seeded, and every polygon valid.
          DO $$
          DECLARE invalid_count int; zone_count int;
          BEGIN
            SELECT count(*) INTO zone_count FROM geo_zones;
            IF zone_count = 0 THEN
              RAISE EXCEPTION 'geo_zones is empty — the Santa Elena seed did not apply';
            END IF;
            SELECT count(*) INTO invalid_count FROM geo_zones WHERE NOT ST_IsValid(polygon);
            IF invalid_count > 0 THEN
              RAISE EXCEPTION '% geo_zones rows have invalid geometry', invalid_count;
            END IF;
          END $$;

          -- Containment discriminates: inside Santa Elena matches, Quito does not.
          -- A swapped lat/lng argument order fails here and nowhere else.
          DO $$
          DECLARE inside int; outside int;
          BEGIN
            SELECT count(*) INTO inside FROM geo_zones
             WHERE ST_Contains(polygon, ST_SetSRID(ST_Point(-80.5, -2.2), 4326));
            SELECT count(*) INTO outside FROM geo_zones
             WHERE ST_Contains(polygon, ST_SetSRID(ST_Point(-78.47, -0.18), 4326));
            IF inside = 0 THEN
              RAISE EXCEPTION 'a point inside Santa Elena matched no zone';
            END IF;
            IF outside > 0 THEN
              RAISE EXCEPTION 'a point in Quito matched % zone(s) — lat/lng likely swapped', outside;
            END IF;
          END $$;

          -- The anonymous identity exists and cannot modify anything.
          DO $$
          DECLARE perms jsonb;
          BEGIN
            SELECT permissions INTO perms FROM users WHERE device_uuid = 'anonymous';
            IF perms IS NULL THEN
              RAISE EXCEPTION 'anonymous identity row is missing';
            END IF;
            IF EXISTS (
              SELECT 1 FROM jsonb_array_elements_text(perms) AS p
               WHERE p ~ '^(UPDATE|DELETE|ASSIGN) '
            ) THEN
              RAISE EXCEPTION 'anonymous ceiling grants a write permission: %', perms;
            END IF;
          END $$;
          SQL

      - name: Every migration has a rollback
        run: |
          set -euo pipefail
          missing=0
          for file in database/migrations/[0-9]*.sql; do
            name=$(basename "$file" .sql)
            if [ ! -f "database/rollback/${name}.DOWN.sql" ]; then
              echo "::error::missing database/rollback/${name}.DOWN.sql"
              missing=1
            fi
          done
          exit $missing

      - name: Migration log has no unrecorded entries
        run: |
          set -euo pipefail
          missing=0
          for file in database/migrations/[0-9]*.sql; do
            id=$(basename "$file" | cut -d_ -f1)
            if ! grep -q "^| $id |" database/MIGRATION_LOG.md; then
              echo "::error::migration $id is not listed in database/MIGRATION_LOG.md"
              missing=1
            fi
          done
          exit $missing

  frontend:
    # T8.5 / SC-203 — gate para los cambios en `frontend/`. Antes de este
    # job, un PR que sólo tocaba `frontend/src/**` pasaba en verde
    # sin verificar nada del Angular code (mismo riesgo que el job
    # `backend` antes de tener su propio gate: tipos y tests rotos
    # podían mergear). Ahora:
    #   - `pnpm test` corre `jest` (ts-jest typechecks los .ts que
    #     ejercita; cubre auth.service, comment.service y el
    #     interceptor que son los puntos críticos del SC-203).
    #   - `pnpm run build` corre `ng build` que typecheckea con
    #     Angular compiler (strictTemplates + strictInjectionParameters
    #     si están activos) y verifica que el bundle production salga
    #     sin errores de compilación.
    #   - `pnpm run lint` corre eslint sobre `src/` y `e2e/`. Si
    #     la config eslint no existe, el script no-op (no falla).
    needs: changes
    if: |
      github.event_name == 'push' ||
      needs.changes.outputs.frontend == 'true'
    name: Frontend — typecheck (jest), build (ng), lint (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # `defaults.run.working-directory` no aplica a inputs de
          # `uses:` — el path al package.json tiene que ir explícito.
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # --frozen-lockfile: si package.json y pnpm-lock.yaml están
      # desincronizados, falla en vez de resolver silenciosamente.
      - run: pnpm install --frozen-lockfile

      # ts-jest (transpila + typecheck) corre los .spec.ts que
      # importan los services. Si un cambio rompe la firma de
      # `auth.service.ts` o del interceptor, jest falla acá.
      - run: pnpm test

      # `ng build` corre el compilador de Angular que valida:
      #   - strictTemplates
      #   - strictInjectionParameters
      #   - errores de binding en componentes (RegisterComponent,
      #     etc.)
      # Falla con un mensaje claro si hay un import roto o un tipo
      # que no resuelve.
      - run: pnpm run build

      # Lint. Si el proyecto no tiene config eslint, este comando
      # falla rápido — debería agregarse en un change aparte. Por
      # ahora, lo dejamos opcional (|| true) hasta que se defina la
      # convención.
      - run: |
          if [ -f .eslintrc.json ] || [ -f .eslintrc.js ] || [ -f .eslintrc.yml ] || [ -f eslint.config.js ] || [ -f eslint.config.mjs ]; then
            pnpm exec eslint "src/**/*.{ts,html}" "e2e/**/*.ts"
          else
            echo "::notice::no eslint config found, skipping lint"
          fi

  frontend-e2e:
    # SC-203 — Playwright e2e. Sólo corre en push a develop/main y
    # en PRs que tocan `frontend/`. Requiere:
    #   - Supabase staging o un backend real con seed
    #     (`admin@correo.com` / `123456` + un incident válido).
    #   - Los secrets `STAGING_DATABASE_URL` y `STAGING_REDIS_URL`
    #     configurados en el environment `staging` de GitHub (los
    #     mismos que usa `rehearsal-staging.yml`).
    #
    # El `webServer` de `playwright.config.ts` arranca el dev server
    # automáticamente. Los specs actuales son smoke flows — para
    # e2e con backend real habría que pasar `BASE_URL` apuntando
    # al server de staging.
    needs: changes
    if: |
      github.event_name == 'push' ||
      needs.changes.outputs.frontend == 'true'
    name: Frontend e2e (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Cambio `2026-09-03-e2e-test-user-and-credentials` (D5): cachear
      # `~/.cache/ms-playwright` ata al lockfile de pnpm, no a una
      # versión de Playwright a mano. Si el lockfile cambia, la versión
      # del navegador puede cambiar con él; atar al lockfile evita el
      # escenario "lockfile estable + navegador desactualizado" sin
      # obligar a editar el workflow cada vez que Playwright bumpea.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      # Playwright necesita el browser binary. `--with-deps`
      # instala también las libs del sistema (libnss, libxss, etc.)
      # que el browser usa en Linux. **No** lo cubre la caché de
      # arriba (son paquetes apt), pero reinstalarlos es barato
      # comparado con el navegador.
      - run: pnpm exec playwright install --with-deps chromium

      # Sin `BASE_URL`, playwright arranca el dev server local vía
      # `webServer` en `playwright.config.ts`. Para apuntar a un
      # backend real, exportar `BASE_URL=https://staging.tase.ec`.
      # SC-208: hard-fail (removed the `|| echo "::warning::"` soft-fail
      # that hid every prior failure). If the backend is unreachable
      # in CI the job goes red — the proposal accepts that trade-off
      # because a green-by-default frontend e2e gate proves nothing.
      #
      # Cambio `2026-09-03-e2e-test-user-and-credentials` (D4 + C.1):
      # `E2E_PASSWORD` se inyecta como secret. El helper distingue
      # "sin backend" (skip) de "backend sin secret" (falla); sin
      # este env, el segundo caso era un skip silencioso.
      - name: Run Playwright tests
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: pnpm run test:e2e --reporter=list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  cutover:
    # T8 — Database Cutover (change `2026-08-26-t8-database-cutover`).
    #
    # The integrity-referential and rollback-cycle e2e specs take 4-5 min
    # each against a real Testcontainers Postgres+PostGIS. Running them on
    # every PR would make CI unusable, so this job is gated to:
    #   1. push to `main` (the long-lived branch where the cutover lives), AND
    #   2. the nightly schedule below.
    # It does NOT run on PRs, and it does NOT run on push to `develop`.
    #
    # The intent is "prove the cutover path still works the night before we
    # actually pull the trigger" — not "gate every code change on a slow
    # schema audit". See design.md D2 of the change for the rationale.
    name: Cutover — FK inventory, rollback cycle, cutover validation
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule'
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: transito_alerta_cutover
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test:e2e:cutover

  cutover-nightly:
    # Companion to the `cutover` job: a separate schedule that runs on the
    # default branch only (cron here only fires on the default branch per
    # GitHub Actions rules). Same command, separate visibility in the
    # Actions tab so a nightly regression is easy to find.
    name: Cutover (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: transito_alerta_cutover
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test:e2e:cutover
