# compose.yaml — infraestructura + backend staging
#
# Local dev (solo infra — backend corre con pnpm run start:dev):
#   docker compose up -d
#
# Staging (todas las capas):
#   docker compose --profile staging up -d --build

services:

  # ── Base de datos (PostGIS 16 — igual que Supabase producción) ────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: tase-postgres
    # Techo duro al log. El driver por defecto de Docker es `json-file` SIN
    # límite: el archivo crece hasta llenar el disco. 10 MB × 3 archivos = 30 MB
    # por contenedor, y el más viejo se descarta solo.
    #
    # Va en los cuatro servicios, no sólo en el backend: postgres y redis
    # también escriben, y un techo que cubre a tres de cuatro no es un techo.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5437}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transito_alerta}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-transito_alerta}']
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Redis (Streams DB 0 + Cache DB 1) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tase-redis
    # Mismo techo de log que postgres — ver el comentario allí.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6381}:6379'
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Backend NestJS (solo perfil staging) ─────────────────────────────────────
  backend:
    profiles: [staging]
    build:
      # El contexto de build es la raíz del repo porque `scripts/rebuild-feed.ts`
      # importa `../../database/seeds/lib/guard`, un archivo que vive en
      # `database/` (fuera de `backend/`). Con un contexto reducido a sólo
      # `backend/`, ese archivo no entra a la imagen y el build falla con
      # TS2307. Ver `.dockerignore` en la raíz para mantener el contexto
      # ligero (excluye GeoReporta/, .git/, docs/, openspec/, frontend/, etc.).
      context: .
      dockerfile: backend/Dockerfile
      target: production
    image: tase-backend:${IMAGE_TAG:-latest}
    container_name: tase-backend
    # Mismo techo de log que postgres — ver el comentario allí.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3004}:3001'
    env_file: .env
    environment:
      # Estas dos variables usan el nombre del servicio Docker (red interna).
      # Sobreescriben cualquier valor en .env para que el backend no intente
      # conectar a Supabase/externo desde dentro del contenedor.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-transito_alerta}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Frontend Angular + Nginx (solo perfil staging) ──────────────────────────────
  frontend:
    profiles: [staging]
    # Construido, no sólo servido. Antes era `image: nginx:alpine` con
    # `./frontend/dist/browser` montado como volumen. El `--build` del deploy
    # no lo tocaba —sólo construye servicios con sección `build:`— así que
    # staging sirvió durante días un artefacto hecho a mano el 29 de agosto,
    # sin relación con el commit desplegado.
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    image: tase-frontend:${IMAGE_TAG:-latest}
    container_name: tase-frontend
    # Mismo techo de log que postgres — ver el comentario allí.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-8083}:80'
    volumes:
      # El montaje de dist/ SE ELIMINÓ a propósito: un volumen del host tapa
      # el contenido de la imagen, así que dejarlo habría hecho que la app
      # recién construida quedara oculta detrás del build viejo — el mismo
      # bug, con más pasos.
      #
      # nginx.conf sí sigue montado: es configuración de despliegue, no
      # artefacto de build, y así se ajusta sin reconstruir la imagen.
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 y NO `localhost`. Docker escribe las dos entradas en el
      # /etc/hosts del contenedor (`127.0.0.1 localhost` y `::1 localhost`),
      # mientras que nginx.conf declara `listen 80;` a secas — que bindea
      # únicamente 0.0.0.0, no [::]. busybox wget resolvía `localhost` a ::1,
      # se comía un "Connection refused" y marcaba el contenedor unhealthy
      # aunque nginx estuviera sirviendo tráfico real sin un solo error.
      #
      # No era intermitente: FailingStreak 368 sobre un contenedor de 3 horas,
      # o sea desde el primer deploy con este Dockerfile. Pasó inadvertido
      # porque `docker compose up -d` no espera healthchecks y el health check
      # del workflow consulta el puerto publicado DESDE EL HOST, donde
      # docker-proxy sí traduce IPv6 → IPv4 y responde 200: el deploy daba
      # verde con el contenedor enfermo.
      #
      # Se arregla acá y no con `listen [::]:80;` en nginx.conf a propósito:
      # en un contenedor sin IPv6 ese bind falla al arrancar
      # ("Address family not supported by protocol") y nginx no levanta. El
      # tráfico IPv6 externo ya funciona vía docker-proxy.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:80/ > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
